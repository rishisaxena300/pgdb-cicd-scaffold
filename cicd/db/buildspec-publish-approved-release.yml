version: 0.2

env:
  shell: bash

phases:

  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "PUBLISH APPROVED DATABASE RELEASE"
        echo "========================================"

        if [ -z "${RELEASE_BUCKET:-}" ]; then
          echo "ERROR - RELEASE_BUCKET is required"
          exit 1
        fi

        if [ -z "${ENVIRONMENT:-}" ]; then
          echo "ERROR - ENVIRONMENT is required"
          exit 1
        fi

        if [ "${ENVIRONMENT}" = "placeholder" ]; then
          echo "ERROR - ENVIRONMENT was not overridden"
          exit 1
        fi

        ENVIRONMENT="$(
          printf '%s' "${ENVIRONMENT}" |
          xargs |
          tr '[:lower:]' '[:upper:]'
        )"

        export ENVIRONMENT

        case "${ENVIRONMENT}" in

          T1|T2)
            ;;

          *)
            echo "ERROR - ENVIRONMENT must be T1 or T2"
            echo "Received value is '${ENVIRONMENT}'"
            exit 1
            ;;

        esac

        echo "Plan environment=${ENVIRONMENT}"
        echo "Release bucket=${RELEASE_BUCKET}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "DOWNLOAD PENDING RELEASE"
        echo "========================================"

        PENDING_KEY="pending-release/${ENVIRONMENT}/current.json"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${PENDING_KEY}" \
          /tmp/pending-release.json

        if ! jq -e . \
          /tmp/pending-release.json \
          >/dev/null
        then
          echo "ERROR - Pending release JSON is invalid"
          exit 1
        fi

        echo "Pending release:"

        cat /tmp/pending-release.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE PENDING RELEASE"
        echo "========================================"

        RELEASE_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            /tmp/pending-release.json
        )"

        RELEASE_COMMIT="$(
          jq -r \
            '.release_commit // empty' \
            /tmp/pending-release.json
        )"

        RELEASE_PREFIX="$(
          jq -r \
            '.release_prefix // empty' \
            /tmp/pending-release.json
        )"

        RELEASE_ENVIRONMENT="$(
          jq -r \
            '.environment // empty' \
            /tmp/pending-release.json
        )"

        RELEASE_COMPLETE="$(
          jq -r \
            '.release_complete // false' \
            /tmp/pending-release.json
        )"

        DATABASE_COUNT="$(
          jq -r \
            '.database_count // 0' \
            /tmp/pending-release.json
        )"

        SCHEMA_COUNT="$(
          jq -r \
            '.schema_count // 0' \
            /tmp/pending-release.json
        )"

        GENERATE_BUILD_ID="$(
          jq -r \
            '.generate_build_id // empty' \
            /tmp/pending-release.json
        )"

        if [ -z "${RELEASE_BRANCH}" ]; then
          echo "ERROR - release_branch is missing"
          exit 1
        fi

        if [ -z "${RELEASE_COMMIT}" ]; then
          echo "ERROR - release_commit is missing"
          exit 1
        fi

        if [ -z "${RELEASE_PREFIX}" ]; then
          echo "ERROR - release_prefix is missing"
          exit 1
        fi

        if [ -z "${RELEASE_ENVIRONMENT}" ]; then
          echo "ERROR - environment is missing"
          exit 1
        fi

        if [ "${RELEASE_ENVIRONMENT}" != "${ENVIRONMENT}" ]; then
          echo "ERROR - Pending release environment mismatch"
          echo "Pipeline plan environment=${ENVIRONMENT}"
          echo "Release plan environment=${RELEASE_ENVIRONMENT}"
          exit 1
        fi

        if [ "${RELEASE_COMPLETE}" != "true" ]; then
          echo "ERROR - Pending release is not complete"
          exit 1
        fi

        if ! [[ "${DATABASE_COUNT}" =~ ^[0-9]+$ ]] || \
           [ "${DATABASE_COUNT}" -eq 0 ]
        then
          echo "ERROR - Invalid database_count"
          echo "database_count=${DATABASE_COUNT}"
          exit 1
        fi

        if ! [[ "${SCHEMA_COUNT}" =~ ^[0-9]+$ ]] || \
           [ "${SCHEMA_COUNT}" -eq 0 ]
        then
          echo "ERROR - Invalid schema_count"
          echo "schema_count=${SCHEMA_COUNT}"
          exit 1
        fi

        export RELEASE_BRANCH
        export RELEASE_COMMIT
        export RELEASE_PREFIX

        echo "Release branch=${RELEASE_BRANCH}"
        echo "Release commit=${RELEASE_COMMIT}"
        echo "Release prefix=${RELEASE_PREFIX}"
        echo "Plan environment=${RELEASE_ENVIRONMENT}"
        echo "Database count=${DATABASE_COUNT}"
        echo "Schema count=${SCHEMA_COUNT}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY IMMUTABLE RELEASE"
        echo "========================================"

        for object_key in \
          "${RELEASE_PREFIX}/manifest.json" \
          "${RELEASE_PREFIX}/desired/desired-schema.zip" \
          "${RELEASE_PREFIX}/desired/desired-schema.zip.sha256"
        do

          aws s3api head-object \
            --bucket "${RELEASE_BUCKET}" \
            --key "${object_key}" \
            >/dev/null

          echo "Verified ${object_key}"

        done


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY RELEASE MANIFEST"
        echo "========================================"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/manifest.json" \
          /tmp/release-manifest.json

        if ! jq -e . \
          /tmp/release-manifest.json \
          >/dev/null
        then
          echo "ERROR - Release manifest is invalid JSON"
          exit 1
        fi

        MANIFEST_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            /tmp/release-manifest.json
        )"

        MANIFEST_COMMIT="$(
          jq -r \
            '.git_commit // empty' \
            /tmp/release-manifest.json
        )"

        if [ "${MANIFEST_BRANCH}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - Manifest branch mismatch"
          echo "Pending=${RELEASE_BRANCH}"
          echo "Manifest=${MANIFEST_BRANCH}"
          exit 1
        fi

        if [ "${MANIFEST_COMMIT}" != "${RELEASE_COMMIT}" ]; then
          echo "ERROR - Manifest commit mismatch"
          echo "Pending=${RELEASE_COMMIT}"
          echo "Manifest=${MANIFEST_COMMIT}"
          exit 1
        fi

        echo "Release manifest verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY DESIRED SCHEMA CHECKSUM"
        echo "========================================"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip" \
          /tmp/desired-schema.zip

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip.sha256" \
          /tmp/desired-schema.zip.sha256

        EXPECTED_SHA="$(
          awk '{print $1}' \
            /tmp/desired-schema.zip.sha256
        )"

        ACTUAL_SHA="$(
          sha256sum \
            /tmp/desired-schema.zip |
          awk '{print $1}'
        )"

        if [ -z "${EXPECTED_SHA}" ]; then
          echo "ERROR - Desired schema expected SHA256 is empty"
          exit 1
        fi

        if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
          echo "ERROR - Desired schema checksum mismatch"
          echo "Expected=${EXPECTED_SHA}"
          echo "Actual=${ACTUAL_SHA}"
          exit 1
        fi

        echo "Desired schema checksum verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "CREATE APPROVED RELEASE POINTER"
        echo "========================================"

        jq -n \
          --arg release_branch "${RELEASE_BRANCH}" \
          --arg release_commit "${RELEASE_COMMIT}" \
          --arg release_prefix "${RELEASE_PREFIX}" \
          --arg plan_environment "${ENVIRONMENT}" \
          --arg generate_build_id "${GENERATE_BUILD_ID}" \
          --argjson database_count "${DATABASE_COUNT}" \
          --argjson schema_count "${SCHEMA_COUNT}" \
          '{
            release_branch: $release_branch,
            release_commit: $release_commit,
            release_prefix: $release_prefix,
            plan_environment: $plan_environment,
            generate_build_id: $generate_build_id,
            database_count: $database_count,
            schema_count: $schema_count,
            release_complete: true,
            approved: true
          }' \
          > /tmp/approved-release.json

        if ! jq -e . \
          /tmp/approved-release.json \
          >/dev/null
        then
          echo "ERROR - Approved release JSON is invalid"
          exit 1
        fi

        echo "Approved release:"

        cat /tmp/approved-release.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "PUBLISH APPROVED RELEASE"
        echo "========================================"

        APPROVED_KEY="approved-release/current.json"

        aws s3 cp \
          /tmp/approved-release.json \
          "s3://${RELEASE_BUCKET}/${APPROVED_KEY}"

        echo "Approved release published:"
        echo "s3://${RELEASE_BUCKET}/${APPROVED_KEY}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY APPROVED RELEASE"
        echo "========================================"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/approved-release/current.json" \
          /tmp/verify-approved-release.json

        if ! cmp -s \
          /tmp/approved-release.json \
          /tmp/verify-approved-release.json
        then
          echo "ERROR - Approved release verification failed"
          exit 1
        fi

        APPROVED="$(
          jq -r \
            '.approved // false' \
            /tmp/verify-approved-release.json
        )"

        VERIFIED_PREFIX="$(
          jq -r \
            '.release_prefix // empty' \
            /tmp/verify-approved-release.json
        )"

        VERIFIED_COMMIT="$(
          jq -r \
            '.release_commit // empty' \
            /tmp/verify-approved-release.json
        )"

        if [ "${APPROVED}" != "true" ]; then
          echo "ERROR - Release is not marked approved"
          exit 1
        fi

        if [ "${VERIFIED_PREFIX}" != "${RELEASE_PREFIX}" ]; then
          echo "ERROR - Approved release prefix mismatch"
          exit 1
        fi

        if [ "${VERIFIED_COMMIT}" != "${RELEASE_COMMIT}" ]; then
          echo "ERROR - Approved release commit mismatch"
          exit 1
        fi

        echo "Approved release verified"


      - |
        echo "========================================"
        echo "DATABASE RELEASE APPROVED"
        echo "========================================"

        echo "Release branch:"
        echo "${RELEASE_BRANCH}"

        echo "Release commit:"
        echo "${RELEASE_COMMIT}"

        echo "Release prefix:"
        echo "${RELEASE_PREFIX}"

        echo "Plan environment:"
        echo "${ENVIRONMENT}"

        echo "Approved release pointer:"
        echo "s3://${RELEASE_BUCKET}/approved-release/current.json"

        echo "This approved release can now be"
        echo "consumed by separate deployment pipelines."
