version: 0.2

env:
  shell: bash

  variables:
    PG_SCHEMA_DIFF_VERSION: "v1.0.9"

phases:

  install:

    runtime-versions:
      golang: 1.27

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "BACH DB CI/CD - GENERATE"
        echo "========================================"

        echo "========================================"
        echo "VERIFY BASE CODEBUILD TOOLS"
        echo "========================================"

        command -v git
        command -v jq
        command -v zip
        command -v unzip
        command -v aws
        command -v go

        git --version
        jq --version
        aws --version
        go version

        echo "========================================"
        echo "INSTALL POSTGRESQL CLIENT"
        echo "========================================"

        UBUNTU_SOURCE_FILES="$(
          grep -rlE \
            'archive.ubuntu.com|[a-z0-9.-]+.ec2.archive.ubuntu.com|security.ubuntu.com' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d \
            2>/dev/null || true
        )"

        if [ -z "${UBUNTU_SOURCE_FILES}" ]; then
          echo "ERROR - Ubuntu APT source files could not be identified"
          exit 1
        fi

        echo "Using Ubuntu APT source files:"
        printf '%s\n' "${UBUNTU_SOURCE_FILES}"

        POSTGRES_CLIENT_INSTALLED="false"

        while IFS= read -r SOURCE_FILE
        do

          echo "Trying Ubuntu source:"
          echo "${SOURCE_FILE}"

          apt-get \
            -o Dir::Etc::sourcelist="${SOURCE_FILE}" \
            -o Dir::Etc::sourceparts="-" \
            update

          if DEBIAN_FRONTEND=noninteractive \
             apt-get \
               -o Dir::Etc::sourcelist="${SOURCE_FILE}" \
               -o Dir::Etc::sourceparts="-" \
               install -y postgresql-client
          then

            POSTGRES_CLIENT_INSTALLED="true"
            break

          fi

        done <<< "${UBUNTU_SOURCE_FILES}"

        if [ "${POSTGRES_CLIENT_INSTALLED}" != "true" ]; then
          echo "ERROR - PostgreSQL client installation failed"
          exit 1
        fi

        echo "========================================"
        echo "VERIFY POSTGRESQL CLIENT"
        echo "========================================"

        command -v psql
        command -v pg_dump

        psql --version
        pg_dump --version

        echo "========================================"
        echo "INSTALL PG-SCHEMA-DIFF"
        echo "========================================"

        echo "Installing pg-schema-diff ${PG_SCHEMA_DIFF_VERSION}"

        GOBIN=/usr/local/bin \
        go install \
          github.com/stripe/pg-schema-diff/cmd/pg-schema-diff@${PG_SCHEMA_DIFF_VERSION}

        echo "========================================"
        echo "VERIFY PG-SCHEMA-DIFF"
        echo "========================================"

        command -v pg-schema-diff

        pg-schema-diff version

        echo "Database CI/CD tooling is ready"


  pre_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE PIPELINE INPUT"
        echo "========================================"

        if [ -z "${RELEASE_BRANCH:-}" ]; then
          echo "ERROR - RELEASE_BRANCH is required"
          exit 1
        fi

        if [ -z "${ENVIRONMENT:-}" ]; then
          echo "ERROR - ENVIRONMENT is required"
          exit 1
        fi

        if [ -z "${RELEASE_BUCKET:-}" ]; then
          echo "ERROR - RELEASE_BUCKET is required"
          exit 1
        fi

        echo "========================================"
        echo "NORMALIZE INPUT"
        echo "========================================"

        RELEASE_BRANCH="$(
          printf '%s' "${RELEASE_BRANCH}" |
          xargs
        )"

        ENVIRONMENT="$(
          printf '%s' "${ENVIRONMENT}" |
          xargs |
          tr '[:lower:]' '[:upper:]'
        )"

        RELEASE_BUCKET="$(
          printf '%s' "${RELEASE_BUCKET}" |
          xargs
        )"

        export RELEASE_BRANCH
        export ENVIRONMENT
        export RELEASE_BUCKET

        echo "Release branch is '${RELEASE_BRANCH}'"
        echo "Target environment is '${ENVIRONMENT}'"
        echo "Release bucket is '${RELEASE_BUCKET}'"

        echo "========================================"
        echo "VALIDATE NORMALIZED ENVIRONMENT"
        echo "========================================"

        case "${ENVIRONMENT}" in

          T1|T2)
            echo "Environment validation passed"
            ;;

          *)
            echo "ERROR - ENVIRONMENT must be T1 or T2"
            echo "Received value is '${ENVIRONMENT}'"
            exit 1
            ;;

        esac

        echo "========================================"
        echo "CHECKOUT RELEASE BRANCH"
        echo "========================================"

        git remote -v

        echo "Fetching branch ${RELEASE_BRANCH}"

        git fetch origin "${RELEASE_BRANCH}"

        echo "Checking out branch ${RELEASE_BRANCH}"

        git checkout -B \
          "${RELEASE_BRANCH}" \
          "origin/${RELEASE_BRANCH}"

        CURRENT_BRANCH="$(
          git branch --show-current
        )"

        CURRENT_COMMIT="$(
          git rev-parse HEAD
        )"

        echo "Requested branch is ${RELEASE_BRANCH}"
        echo "Checked out branch is ${CURRENT_BRANCH}"
        echo "Resolved commit is ${CURRENT_COMMIT}"

        if [ "${CURRENT_BRANCH}" != "${RELEASE_BRANCH}" ]; then

          echo "ERROR - checked out branch does not match RELEASE_BRANCH"
          exit 1

        fi

        echo "========================================"
        echo "VERIFY DATABASE CI/CD FILES"
        echo "========================================"

        if [ ! -d "Aurora-PostgreSQL-DB" ]; then
          echo "ERROR - Aurora-PostgreSQL-DB directory is missing"
          exit 1
        fi

        if [ ! -d "cicd/db" ]; then
          echo "ERROR - cicd/db directory is missing"
          exit 1
        fi

        if [ ! -d "cicd/db/scripts" ]; then
          echo "ERROR - cicd/db/scripts directory is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/database-config.json" ]; then
          echo "ERROR - cicd/db/database-config.json is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/scripts/create_release.sh" ]; then
          echo "ERROR - create_release.sh is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/scripts/load_secret.sh" ]; then
          echo "ERROR - load_secret.sh is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/scripts/generate_plans.sh" ]; then
          echo "ERROR - generate_plans.sh is missing"
          exit 1
        fi

        echo "Required database CI/CD files found"

        chmod +x cicd/db/scripts/*.sh

        echo "========================================"
        echo "LOAD PLAN DATABASE CREDENTIALS"
        echo "========================================"

        source cicd/db/scripts/load_secret.sh plan

        echo "Plan database credentials loaded successfully"

        echo "Database host is ${PGHOST}"
        echo "Database port is ${PGPORT}"
        echo "Database user is ${PGUSER}"


  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "CREATE DESIRED SCHEMA BUNDLE"
        echo "========================================"

        cicd/db/scripts/create_release.sh

        echo "========================================"
        echo "GENERATE DATABASE PLANS"
        echo "========================================"

        cicd/db/scripts/generate_plans.sh


  post_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "DATABASE PLAN GENERATION COMPLETED"
        echo "========================================"

        if [ -d "output" ]; then

          echo "Generated files:"

          find output \
            -type f \
            -print

        else

          echo "No output directory found"

        fi


artifacts:

  files:
    - "output/**/*"

  discard-paths: no
