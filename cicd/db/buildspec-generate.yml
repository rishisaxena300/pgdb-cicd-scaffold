version: 0.2

env:
  shell: bash
  variables:
    PG_SCHEMA_DIFF_VERSION: "v1.0.9"

phases:
  install:
    runtime-versions:
      golang: 1.27

    commands:
      - |
        set -euo pipefail

        echo "========================================"
        echo "BACH DB CI/CD - GENERATE"
        echo "========================================"
        echo "INSTALL DATABASE CI/CD TOOLS"
        echo "========================================"

        apt-get update

        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          postgresql-client \
          jq \
          zip \
          unzip \
          ca-certificates

        echo "========================================"
        echo "INSTALL PG-SCHEMA-DIFF"
        echo "========================================"

        echo "Installing pg-schema-diff ${PG_SCHEMA_DIFF_VERSION}"

        GOBIN=/usr/local/bin \
        go install github.com/stripe/pg-schema-diff/cmd/pg-schema-diff@${PG_SCHEMA_DIFF_VERSION}

        echo "========================================"
        echo "VERIFY INSTALLED TOOLS"
        echo "========================================"

        command -v pg-schema-diff
        command -v psql
        command -v pg_dump
        command -v jq
        command -v aws

        go version
        pg-schema-diff --version
        psql --version
        pg_dump --version
        jq --version
        aws --version

  pre_build:
    commands:
      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE BUILD INPUTS"
        echo "========================================"

        if [ -z "${RELEASE_BRANCH:-}" ]; then
          echo "ERROR - RELEASE_BRANCH is required"
          exit 1
        fi

        if [ -z "${ENVIRONMENT:-}" ]; then
          echo "ERROR - ENVIRONMENT is required"
          exit 1
        fi

        if [ -z "${RELEASE_BUCKET:-}" ]; then
          echo "ERROR - RELEASE_BUCKET is required"
          exit 1
        fi

        if [ "${ENVIRONMENT}" != "T1" ] && [ "${ENVIRONMENT}" != "T2" ]; then
          echo "ERROR - ENVIRONMENT must be T1 or T2"
          exit 1
        fi

        echo "Requested release branch is ${RELEASE_BRANCH}"
        echo "Target environment is ${ENVIRONMENT}"
        echo "Release bucket is ${RELEASE_BUCKET}"

        echo "========================================"
        echo "CHECKOUT REQUESTED RELEASE BRANCH"
        echo "========================================"

        git remote -v

        git fetch origin "${RELEASE_BRANCH}"

        git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

        CURRENT_BRANCH="$(git branch --show-current)"
        CURRENT_COMMIT="$(git rev-parse HEAD)"

        echo "Requested branch is ${RELEASE_BRANCH}"
        echo "Checked out branch is ${CURRENT_BRANCH}"
        echo "Resolved commit is ${CURRENT_COMMIT}"

        if [ "${CURRENT_BRANCH}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - checked out branch does not match RELEASE_BRANCH"
          exit 1
        fi

        echo "========================================"
        echo "VERIFY DATABASE CI/CD FILES"
        echo "========================================"

        test -d Aurora-PostgreSQL-DB
        test -d cicd/db
        test -d cicd/db/scripts

        test -f cicd/db/database-config.json
        test -f cicd/db/scripts/create_release.sh
        test -f cicd/db/scripts/load_secret.sh
        test -f cicd/db/scripts/generate_plans.sh

        chmod +x cicd/db/scripts/*.sh

        echo "========================================"
        echo "LOAD PLAN DATABASE SECRET"
        echo "========================================"

        source cicd/db/scripts/load_secret.sh plan

        echo "Plan database secret loaded successfully"

        echo "Database host is ${PGHOST}"
        echo "Database port is ${PGPORT}"
        echo "Database user is ${PGUSER}"

  build:
    commands:
      - |
        set -euo pipefail

        echo "========================================"
        echo "CREATE DESIRED SCHEMA BUNDLE"
        echo "========================================"

        cicd/db/scripts/create_release.sh

        echo "========================================"
        echo "GENERATE DATABASE MIGRATION"
        echo "========================================"

        cicd/db/scripts/generate_plans.sh

  post_build:
    commands:
      - |
        echo "========================================"
        echo "DATABASE PLAN GENERATION COMPLETED"
        echo "========================================"

        if [ -d output ]; then
          echo "Generated files:"
          find output -type f -print
        fi

artifacts:
  files:
    - "output/**/*"
  discard-paths: no
