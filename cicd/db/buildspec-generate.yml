version: 0.2

env:
  shell: bash
  variables:
    PG_SCHEMA_DIFF_VERSION: "v1.0.9"

phases:
  install:
    runtime-versions:
      golang: 1.27
    commands:
      - |
        set -euo pipefail

        echo "========================================"
        echo "DB BUILDSPEC VERSION 3"
        echo "INSTALL DATABASE CI/CD TOOLS"
        echo "========================================"

        apt-get update

        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          postgresql-client \
          jq \
          zip \
          unzip \
          ca-certificates

        echo "Installing pg-schema-diff ${PG_SCHEMA_DIFF_VERSION}"

        go install github.com/stripe/pg-schema-diff/cmd/pg-schema-diff@${PG_SCHEMA_DIFF_VERSION}

        cp "$(go env GOPATH)/bin/pg-schema-diff" /usr/local/bin/pg-schema-diff
        chmod 755 /usr/local/bin/pg-schema-diff

        echo "========================================"
        echo "VERIFY TOOL VERSIONS"
        echo "========================================"

        go version
        pg-schema-diff --version
        psql --version
        pg_dump --version
        jq --version
        aws --version

  pre_build:
    commands:
      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE INPUT"
        echo "========================================"

        if [ -z "${RELEASE_BRANCH:-}" ]; then
          echo "ERROR - RELEASE_BRANCH is not set"
          exit 1
        fi

        if [ -z "${ENVIRONMENT:-}" ]; then
          echo "ERROR - ENVIRONMENT is not set"
          exit 1
        fi

        if [ -z "${RELEASE_BUCKET:-}" ]; then
          echo "ERROR - RELEASE_BUCKET is not set"
          exit 1
        fi

        if [ "${ENVIRONMENT}" != "T1" ] && [ "${ENVIRONMENT}" != "T2" ]; then
          echo "ERROR - ENVIRONMENT must be T1 or T2"
          exit 1
        fi

        echo "Release branch is ${RELEASE_BRANCH}"
        echo "Target environment is ${ENVIRONMENT}"

        echo "========================================"
        echo "CHECK GIT SOURCE"
        echo "========================================"

        git status

        CURRENT_COMMIT="$(git rev-parse HEAD)"
        echo "Resolved commit is ${CURRENT_COMMIT}"

        echo "========================================"
        echo "LOAD PLAN DATABASE SECRET"
        echo "========================================"

        chmod +x cicd/db/scripts/*.sh

        source cicd/db/scripts/load_secret.sh plan

        echo "Plan database secret loaded successfully"

  build:
    commands:
      - |
        set -euo pipefail

        echo "========================================"
        echo "CREATE DESIRED SCHEMA BUNDLE"
        echo "========================================"

        cicd/db/scripts/create_release.sh

        echo "========================================"
        echo "GENERATE DATABASE MIGRATION"
        echo "========================================"

        cicd/db/scripts/generate_plans.sh

  post_build:
    commands:
      - |
        echo "========================================"
        echo "DATABASE PLAN GENERATION COMPLETED"
        echo "========================================"

artifacts:
  files:
    - "output/**/*"
