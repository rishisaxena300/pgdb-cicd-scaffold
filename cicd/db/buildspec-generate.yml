version: 0.2

env:
  shell: bash

  variables:
    PG_SCHEMA_DIFF_VERSION: "v1.0.9"

phases:

  install:

    runtime-versions:
      golang: 1.27

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "BACH DB CI/CD - GENERATE"
        echo "========================================"

        echo "========================================"
        echo "VERIFY BASE CODEBUILD TOOLS"
        echo "========================================"

        command -v git
        command -v jq
        command -v zip
        command -v unzip
        command -v aws
        command -v go

        git --version
        jq --version
        zip -v | head -1
        aws --version
        go version

        echo "========================================"
        echo "CHECK POSTGRESQL CLIENT TOOLS"
        echo "========================================"

        if ! command -v psql >/dev/null 2>&1; then
          echo "ERROR - psql is not available in the selected CodeBuild image"
          echo "Install the PostgreSQL client in the CodeBuild environment before continuing"
          exit 1
        fi

        if ! command -v pg_dump >/dev/null 2>&1; then
          echo "ERROR - pg_dump is not available in the selected CodeBuild image"
          echo "Install the PostgreSQL client in the CodeBuild environment before continuing"
          exit 1
        fi

        psql --version
        pg_dump --version

        echo "========================================"
        echo "INSTALL PG-SCHEMA-DIFF"
        echo "========================================"

        echo "Installing pg-schema-diff ${PG_SCHEMA_DIFF_VERSION}"

        GOBIN=/usr/local/bin \
        go install github.com/stripe/pg-schema-diff/cmd/pg-schema-diff@${PG_SCHEMA_DIFF_VERSION}

        echo "========================================"
        echo "VERIFY PG-SCHEMA-DIFF"
        echo "========================================"

        command -v pg-schema-diff

        pg-schema-diff --version

        echo "Database CI/CD tooling is ready"


  pre_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE PIPELINE INPUT"
        echo "========================================"

        if [ -z "${RELEASE_BRANCH:-}" ]; then
          echo "ERROR - RELEASE_BRANCH is required"
          exit 1
        fi

        if [ -z "${ENVIRONMENT:-}" ]; then
          echo "ERROR - ENVIRONMENT is required"
          exit 1
        fi

        if [ -z "${RELEASE_BUCKET:-}" ]; then
          echo "ERROR - RELEASE_BUCKET is required"
          exit 1
        fi

        case "${ENVIRONMENT}" in

          T1|T2)
            ;;

          *)
            echo "ERROR - ENVIRONMENT must be T1 or T2"
            exit 1
            ;;

        esac

        echo "Release branch is ${RELEASE_BRANCH}"
        echo "Target environment is ${ENVIRONMENT}"
        echo "Release bucket is ${RELEASE_BUCKET}"

        echo "========================================"
        echo "CHECKOUT RELEASE BRANCH"
        echo "========================================"

        git remote -v

        git fetch origin "${RELEASE_BRANCH}"

        git checkout -B \
          "${RELEASE_BRANCH}" \
          "origin/${RELEASE_BRANCH}"

        CURRENT_BRANCH="$(
          git branch --show-current
        )"

        CURRENT_COMMIT="$(
          git rev-parse HEAD
        )"

        echo "Requested branch is ${RELEASE_BRANCH}"
        echo "Checked out branch is ${CURRENT_BRANCH}"
        echo "Resolved commit is ${CURRENT_COMMIT}"

        if [ "${CURRENT_BRANCH}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - checked out Git branch does not match RELEASE_BRANCH"
          exit 1
        fi

        echo "========================================"
        echo "VERIFY REPOSITORY STRUCTURE"
        echo "========================================"

        if [ ! -d "Aurora-PostgreSQL-DB" ]; then
          echo "ERROR - Aurora-PostgreSQL-DB directory is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/database-config.json" ]; then
          echo "ERROR - cicd/db/database-config.json is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/scripts/create_release.sh" ]; then
          echo "ERROR - create_release.sh is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/scripts/load_secret.sh" ]; then
          echo "ERROR - load_secret.sh is missing"
          exit 1
        fi

        if [ ! -f "cicd/db/scripts/generate_plans.sh" ]; then
          echo "ERROR - generate_plans.sh is missing"
          exit 1
        fi

        chmod +x cicd/db/scripts/*.sh

        echo "========================================"
        echo "LOAD PLAN DATABASE CREDENTIALS"
        echo "========================================"

        source cicd/db/scripts/load_secret.sh plan

        echo "Plan database credentials loaded successfully"

        echo "Database host is ${PGHOST}"
        echo "Database port is ${PGPORT}"
        echo "Database user is ${PGUSER}"


  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "CREATE DESIRED SCHEMA BUNDLE"
        echo "========================================"

        cicd/db/scripts/create_release.sh

        echo "========================================"
        echo "GENERATE DATABASE PLANS"
        echo "========================================"

        cicd/db/scripts/generate_plans.sh


  post_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "DATABASE PLAN GENERATION COMPLETED"
        echo "========================================"

        if [ -d "output" ]; then

          echo "Generated files:"

          find output \
            -type f \
            -print

        fi


artifacts:

  files:
    - "output/**/*"

  discard-paths: no
