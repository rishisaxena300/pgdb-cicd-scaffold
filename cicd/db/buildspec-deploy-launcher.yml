version: 0.2

env:
  shell: bash

phases:

  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "T1 DATABASE DEPLOY LAUNCHER"
        echo "========================================"

        for variable in \
          RELEASE_BUCKET \
          DEPLOY_PROJECT
        do

          if [ -z "${!variable:-}" ]; then
            echo "ERROR - ${variable} is required"
            exit 1
          fi

        done

        RELEASE_BUCKET="$(
          printf '%s' "${RELEASE_BUCKET}" |
          xargs
        )"

        DEPLOY_PROJECT="$(
          printf '%s' "${DEPLOY_PROJECT}" |
          xargs
        )"

        export RELEASE_BUCKET
        export DEPLOY_PROJECT

        echo "Release bucket=${RELEASE_BUCKET}"
        echo "Deploy project=${DEPLOY_PROJECT}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "DOWNLOAD APPROVED RELEASE POINTER"
        echo "========================================"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/approved-release/current.json" \
          /tmp/approved-release.json

        if ! jq -e . \
          /tmp/approved-release.json \
          >/dev/null
        then
          echo "ERROR - Approved release pointer is invalid JSON"
          exit 1
        fi

        echo "Approved release pointer:"

        cat /tmp/approved-release.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE APPROVED RELEASE POINTER"
        echo "========================================"

        APPROVED="$(
          jq -r \
            '.approved // false' \
            /tmp/approved-release.json
        )"

        RELEASE_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            /tmp/approved-release.json
        )"

        RELEASE_COMMIT="$(
          jq -r \
            '.release_commit // empty' \
            /tmp/approved-release.json
        )"

        RELEASE_PREFIX="$(
          jq -r \
            '.release_prefix // empty' \
            /tmp/approved-release.json
        )"

        PLAN_ENVIRONMENT="$(
          jq -r \
            '.plan_environment // empty' \
            /tmp/approved-release.json
        )"

        if [ "${APPROVED}" != "true" ]; then
          echo "ERROR - Release is not approved"
          exit 1
        fi

        if [ -z "${RELEASE_BRANCH}" ]; then
          echo "ERROR - release_branch is missing"
          exit 1
        fi

        if ! [[ "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "ERROR - release_commit is invalid"
          echo "Received=${RELEASE_COMMIT}"
          exit 1
        fi

        if [ -z "${RELEASE_PREFIX}" ]; then
          echo "ERROR - release_prefix is missing"
          exit 1
        fi

        case "${PLAN_ENVIRONMENT}" in

          T1|T2)
            ;;

          *)
            echo "ERROR - plan_environment must be T1 or T2"
            echo "Received=${PLAN_ENVIRONMENT}"
            exit 1
            ;;

        esac

        case "${RELEASE_PREFIX}" in

          releases/*)
            ;;

          *)
            echo "ERROR - release_prefix is invalid"
            echo "Received=${RELEASE_PREFIX}"
            exit 1
            ;;

        esac

        export RELEASE_BRANCH
        export RELEASE_COMMIT
        export RELEASE_PREFIX
        export PLAN_ENVIRONMENT

        echo "Release branch=${RELEASE_BRANCH}"
        echo "Release commit=${RELEASE_COMMIT}"
        echo "Release prefix=${RELEASE_PREFIX}"
        echo "Plan environment=${PLAN_ENVIRONMENT}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY APPROVED DEPLOYMENT ARTIFACTS"
        echo "========================================"

        for object_key in \
          "${RELEASE_PREFIX}/manifest.json" \
          "${RELEASE_PREFIX}/deployspec.yml" \
          "${RELEASE_PREFIX}/deployspec.yml.sha256" \
          "${RELEASE_PREFIX}/deploy.sh" \
          "${RELEASE_PREFIX}/deploy.sh.sha256"
        do

          aws s3api head-object \
            --bucket "${RELEASE_BUCKET}" \
            --key "${object_key}" \
            >/dev/null

          echo "Verified s3://${RELEASE_BUCKET}/${object_key}"

        done

        rm -rf /tmp/deploy-release

        mkdir -p /tmp/deploy-release

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/manifest.json" \
          /tmp/deploy-release/manifest.json

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deployspec.yml" \
          /tmp/deploy-release/deployspec.yml

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deployspec.yml.sha256" \
          /tmp/deploy-release/deployspec.yml.sha256

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deploy.sh" \
          /tmp/deploy-release/deploy.sh

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deploy.sh.sha256" \
          /tmp/deploy-release/deploy.sh.sha256


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY DEPLOYMENT ARTIFACT CHECKSUMS"
        echo "========================================"

        if ! (
          cd /tmp/deploy-release

          sha256sum \
            --check \
            deployspec.yml.sha256

          sha256sum \
            --check \
            deploy.sh.sha256
        )
        then
          echo "ERROR - Approved deployment artifact checksum failed"
          exit 1
        fi

        DEPLOYSPEC_SHA="$(
          awk '{print $1}' \
            /tmp/deploy-release/deployspec.yml.sha256
        )"

        DEPLOY_SCRIPT_SHA="$(
          awk '{print $1}' \
            /tmp/deploy-release/deploy.sh.sha256
        )"

        if ! [[ "${DEPLOYSPEC_SHA}" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "ERROR - deployspec.yml SHA256 is invalid"
          exit 1
        fi

        if ! [[ "${DEPLOY_SCRIPT_SHA}" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "ERROR - deploy.sh SHA256 is invalid"
          exit 1
        fi

        echo "Approved deployspec.yml checksum verified"
        echo "Approved deploy.sh checksum verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY DEPLOYMENT MANIFEST"
        echo "========================================"

        MANIFEST_FILE="/tmp/deploy-release/manifest.json"

        if ! jq -e . \
          "${MANIFEST_FILE}" \
          >/dev/null
        then
          echo "ERROR - Release manifest is invalid JSON"
          exit 1
        fi

        MANIFEST_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_COMMIT="$(
          jq -r \
            '.git_commit // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOYSPEC_ARTIFACT="$(
          jq -r \
            '.deployment.buildspec.artifact // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOYSPEC_SHA="$(
          jq -r \
            '.deployment.buildspec.sha256 // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOY_SCRIPT_ARTIFACT="$(
          jq -r \
            '.deployment.script.artifact // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOY_SCRIPT_SHA="$(
          jq -r \
            '.deployment.script.sha256 // empty' \
            "${MANIFEST_FILE}"
        )"

        if [ "${MANIFEST_BRANCH}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - Manifest release branch mismatch"
          echo "Approved=${RELEASE_BRANCH}"
          echo "Manifest=${MANIFEST_BRANCH}"
          exit 1
        fi

        if [ "${MANIFEST_COMMIT}" != "${RELEASE_COMMIT}" ]; then
          echo "ERROR - Manifest release commit mismatch"
          echo "Approved=${RELEASE_COMMIT}"
          echo "Manifest=${MANIFEST_COMMIT}"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOYSPEC_ARTIFACT}" != "deployspec.yml" ]; then
          echo "ERROR - Unexpected deployment BuildSpec artifact"
          echo "Manifest=${MANIFEST_DEPLOYSPEC_ARTIFACT}"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOYSPEC_SHA}" != "${DEPLOYSPEC_SHA}" ]; then
          echo "ERROR - deployspec.yml manifest checksum mismatch"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOY_SCRIPT_ARTIFACT}" != "deploy.sh" ]; then
          echo "ERROR - Unexpected deployment script artifact"
          echo "Manifest=${MANIFEST_DEPLOY_SCRIPT_ARTIFACT}"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOY_SCRIPT_SHA}" != "${DEPLOY_SCRIPT_SHA}" ]; then
          echo "ERROR - deploy.sh manifest checksum mismatch"
          exit 1
        fi

        echo "Approved deployment manifest verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "START T1 DATABASE DEPLOY BUILD"
        echo "========================================"

        APPROVED_BUILDSPEC_ARN="arn:aws:s3:::${RELEASE_BUCKET}/${RELEASE_PREFIX}/deployspec.yml"

        DEPLOY_BUILD_ID="$(
          aws codebuild start-build \
            --project-name "${DEPLOY_PROJECT}" \
            --buildspec-override "${APPROVED_BUILDSPEC_ARN}" \
            --environment-variables-override \
              name=RELEASE_PREFIX,value="${RELEASE_PREFIX}",type=PLAINTEXT \
            --query 'build.id' \
            --output text
        )"

        if [ -z "${DEPLOY_BUILD_ID}" ] || \
           [ "${DEPLOY_BUILD_ID}" = "None" ]
        then
          echo "ERROR - No T1 deploy build ID was returned"
          exit 1
        fi

        printf '%s\n' \
          "${DEPLOY_BUILD_ID}" \
          > /tmp/deploy-build-id

        echo "T1 deploy build ID=${DEPLOY_BUILD_ID}"
        echo "Approved BuildSpec=${APPROVED_BUILDSPEC_ARN}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "WAIT FOR T1 DATABASE DEPLOY BUILD"
        echo "========================================"

        DEPLOY_BUILD_ID="$(
          cat /tmp/deploy-build-id
        )"

        while true
        do

          DEPLOY_STATUS="$(
            aws codebuild batch-get-builds \
              --ids "${DEPLOY_BUILD_ID}" \
              --query 'builds[0].buildStatus' \
              --output text
          )"

          echo "T1 deploy status=${DEPLOY_STATUS}"

          case "${DEPLOY_STATUS}" in

            SUCCEEDED)
              echo "T1 database deploy build succeeded"
              break
              ;;

            FAILED|FAULT|STOPPED|TIMED_OUT)
              echo "ERROR - T1 database deploy build ${DEPLOY_STATUS}"
              exit 1
              ;;

            IN_PROGRESS)
              sleep 10
              ;;

            *)
              echo "ERROR - Unexpected deploy status '${DEPLOY_STATUS}'"
              exit 1
              ;;

          esac

        done


      - |
        set -euo pipefail

        echo "========================================"
        echo "T1 DATABASE DEPLOY LAUNCHER COMPLETE"
        echo "========================================"

        echo "Release branch=${RELEASE_BRANCH}"
        echo "Release commit=${RELEASE_COMMIT}"
        echo "Release prefix=${RELEASE_PREFIX}"
        echo "Plan environment=${PLAN_ENVIRONMENT}"
        echo "Target environment=T1"

        echo "The exact approved deployspec.yml and"
        echo "deploy.sh were verified before deployment."
