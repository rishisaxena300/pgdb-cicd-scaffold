version: 0.2

env:
  shell: bash

phases:

  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "DATABASE GENERATE LAUNCHER"
        echo "========================================"

        for variable in \
          RELEASE_BRANCH \
          ENVIRONMENT \
          GENERATE_PROJECT \
          RELEASE_BUCKET
        do
          if [ -z "${!variable:-}" ]; then
            echo "ERROR - ${variable} is missing"
            exit 1
          fi
        done

        if [ "${RELEASE_BRANCH}" = "placeholder" ]; then
          echo "ERROR - RELEASE_BRANCH was not overridden"
          exit 1
        fi

        if [ "${ENVIRONMENT}" = "placeholder" ]; then
          echo "ERROR - ENVIRONMENT was not overridden"
          exit 1
        fi

        RELEASE_BRANCH="$(
          printf '%s' "${RELEASE_BRANCH}" |
          xargs
        )"

        ENVIRONMENT="$(
          printf '%s' "${ENVIRONMENT}" |
          xargs |
          tr '[:lower:]' '[:upper:]'
        )"

        GENERATE_PROJECT="$(
          printf '%s' "${GENERATE_PROJECT}" |
          xargs
        )"

        RELEASE_BUCKET="$(
          printf '%s' "${RELEASE_BUCKET}" |
          xargs
        )"

        export RELEASE_BRANCH
        export ENVIRONMENT
        export GENERATE_PROJECT
        export RELEASE_BUCKET

        case "${ENVIRONMENT}" in
          T1|T2)
            ;;
          *)
            echo "ERROR - ENVIRONMENT must be T1 or T2"
            echo "Received value is '${ENVIRONMENT}'"
            exit 1
            ;;
        esac

        echo "RELEASE_BRANCH=${RELEASE_BRANCH}"
        echo "PLAN_ENVIRONMENT=${ENVIRONMENT}"
        echo "GENERATE_PROJECT=${GENERATE_PROJECT}"
        echo "RELEASE_BUCKET=${RELEASE_BUCKET}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "START DATABASE GENERATE BUILD"
        echo "========================================"

        BUILD_ID="$(
          aws codebuild start-build \
            --project-name "${GENERATE_PROJECT}" \
            --source-version "${RELEASE_BRANCH}" \
            --environment-variables-override \
              name=RELEASE_BRANCH,value="${RELEASE_BRANCH}",type=PLAINTEXT \
              name=ENVIRONMENT,value="${ENVIRONMENT}",type=PLAINTEXT \
            --query 'build.id' \
            --output text
        )"

        if [ -z "${BUILD_ID}" ] || \
           [ "${BUILD_ID}" = "None" ]
        then
          echo "ERROR - No child build ID returned"
          exit 1
        fi

        printf '%s\n' \
          "${BUILD_ID}" \
          > /tmp/generate-build-id

        echo "Generate build ID=${BUILD_ID}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "WAIT FOR DATABASE GENERATE BUILD"
        echo "========================================"

        BUILD_ID="$(
          cat /tmp/generate-build-id
        )"

        while true
        do
          BUILD_STATUS="$(
            aws codebuild batch-get-builds \
              --ids "${BUILD_ID}" \
              --query 'builds[0].buildStatus' \
              --output text
          )"

          echo "Generate status=${BUILD_STATUS}"

          case "${BUILD_STATUS}" in
            SUCCEEDED)
              echo "Generate build succeeded"
              break
              ;;

            FAILED|FAULT|STOPPED|TIMED_OUT)
              echo "ERROR - Generate build ${BUILD_STATUS}"
              exit 1
              ;;

            IN_PROGRESS)
              sleep 10
              ;;

            *)
              echo "ERROR - Unexpected Generate status '${BUILD_STATUS}'"
              exit 1
              ;;
          esac
        done


      - |
        set -euo pipefail

        echo "========================================"
        echo "GET GENERATED RELEASE INFORMATION"
        echo "========================================"

        BUILD_ID="$(
          cat /tmp/generate-build-id
        )"

        RELEASE_COMMIT="$(
          aws codebuild batch-get-builds \
            --ids "${BUILD_ID}" \
            --query 'builds[0].resolvedSourceVersion' \
            --output text
        )"

        SOURCE_VERSION="$(
          aws codebuild batch-get-builds \
            --ids "${BUILD_ID}" \
            --query 'builds[0].sourceVersion' \
            --output text
        )"

        if [ -z "${RELEASE_COMMIT}" ] || \
           [ "${RELEASE_COMMIT}" = "None" ]
        then
          echo "ERROR - Unable to determine release commit"
          exit 1
        fi

        if [ -z "${SOURCE_VERSION}" ] || \
           [ "${SOURCE_VERSION}" = "None" ]
        then
          echo "ERROR - Unable to determine child source version"
          exit 1
        fi

        if [ "${SOURCE_VERSION}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - Child source version mismatch"
          echo "Requested=${RELEASE_BRANCH}"
          echo "Actual=${SOURCE_VERSION}"
          exit 1
        fi

        if ! [[ "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "ERROR - Resolved source version is not a full Git commit"
          echo "Value=${RELEASE_COMMIT}"
          exit 1
        fi

        RELEASE_BRANCH_KEY="$(
          printf '%s' "${RELEASE_BRANCH}" |
          sed 's#[^A-Za-z0-9._-]#-#g'
        )"

        if [ -z "${RELEASE_BRANCH_KEY}" ]; then
          echo "ERROR - Unable to create release branch key"
          exit 1
        fi

        SHORT_COMMIT="${RELEASE_COMMIT:0:8}"

        RELEASE_PREFIX="releases/${RELEASE_BRANCH_KEY}/${SHORT_COMMIT}"

        export RELEASE_COMMIT
        export RELEASE_PREFIX

        echo "Release branch=${RELEASE_BRANCH}"
        echo "Release commit=${RELEASE_COMMIT}"
        echo "Release prefix=${RELEASE_PREFIX}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY RELEASE-LEVEL ARTIFACTS"
        echo "========================================"

        for object_key in \
          "${RELEASE_PREFIX}/manifest.json" \
          "${RELEASE_PREFIX}/deployspec.yml" \
          "${RELEASE_PREFIX}/deployspec.yml.sha256" \
          "${RELEASE_PREFIX}/deploy.sh" \
          "${RELEASE_PREFIX}/deploy.sh.sha256" \
          "${RELEASE_PREFIX}/desired/desired-schema.zip" \
          "${RELEASE_PREFIX}/desired/desired-schema.zip.sha256"
        do
          aws s3api head-object \
            --bucket "${RELEASE_BUCKET}" \
            --key "${object_key}" \
            >/dev/null

          echo "Verified s3://${RELEASE_BUCKET}/${object_key}"
        done

        rm -rf /tmp/release-verification

        mkdir -p /tmp/release-verification

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/manifest.json" \
          /tmp/release-verification/manifest.json

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deployspec.yml" \
          /tmp/release-verification/deployspec.yml

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deployspec.yml.sha256" \
          /tmp/release-verification/deployspec.yml.sha256

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deploy.sh" \
          /tmp/release-verification/deploy.sh

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/deploy.sh.sha256" \
          /tmp/release-verification/deploy.sh.sha256

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip" \
          /tmp/release-verification/desired-schema.zip

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip.sha256" \
          /tmp/release-verification/desired-schema.zip.sha256

        echo "Release-level artifacts downloaded"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY RELEASE IDENTITY"
        echo "========================================"

        MANIFEST_FILE="/tmp/release-verification/manifest.json"

        if ! jq -e . \
          "${MANIFEST_FILE}" \
          >/dev/null
        then
          echo "ERROR - Release manifest is invalid"
          exit 1
        fi

        MANIFEST_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_COMMIT="$(
          jq -r \
            '.git_commit // empty' \
            "${MANIFEST_FILE}"
        )"

        if [ "${MANIFEST_BRANCH}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - Manifest release branch mismatch"
          echo "Requested=${RELEASE_BRANCH}"
          echo "Manifest=${MANIFEST_BRANCH}"
          exit 1
        fi

        if [ "${MANIFEST_COMMIT}" != "${RELEASE_COMMIT}" ]; then
          echo "ERROR - Manifest commit mismatch"
          echo "Child=${RELEASE_COMMIT}"
          echo "Manifest=${MANIFEST_COMMIT}"
          exit 1
        fi

        echo "Release identity verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY RELEASE FILE CHECKSUMS"
        echo "========================================"

        VERIFY_DIR="/tmp/release-verification"

        for artifact_name in \
          desired-schema.zip \
          deployspec.yml \
          deploy.sh
        do
          EXPECTED_SHA="$(
            awk '{print $1}' \
              "${VERIFY_DIR}/${artifact_name}.sha256"
          )"

          ACTUAL_SHA="$(
            sha256sum \
              "${VERIFY_DIR}/${artifact_name}" |
            awk '{print $1}'
          )"

          if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR - Invalid expected SHA256"
            echo "Artifact=${artifact_name}"
            echo "Value=${EXPECTED_SHA}"
            exit 1
          fi

          if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
            echo "ERROR - Release artifact checksum mismatch"
            echo "Artifact=${artifact_name}"
            echo "Expected=${EXPECTED_SHA}"
            echo "Actual=${ACTUAL_SHA}"
            exit 1
          fi

          echo "Checksum verified for ${artifact_name}"
        done


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY MANIFEST DEPLOYMENT METADATA"
        echo "========================================"

        MANIFEST_FILE="/tmp/release-verification/manifest.json"

        MANIFEST_DESIRED_ARTIFACT="$(
          jq -r \
            '.desired_schema.artifact // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DESIRED_SHA="$(
          jq -r \
            '.desired_schema.sha256 // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOYSPEC_ARTIFACT="$(
          jq -r \
            '.deployment.buildspec.artifact // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOYSPEC_SHA="$(
          jq -r \
            '.deployment.buildspec.sha256 // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOY_SCRIPT_ARTIFACT="$(
          jq -r \
            '.deployment.script.artifact // empty' \
            "${MANIFEST_FILE}"
        )"

        MANIFEST_DEPLOY_SCRIPT_SHA="$(
          jq -r \
            '.deployment.script.sha256 // empty' \
            "${MANIFEST_FILE}"
        )"

        DESIRED_SHA="$(
          awk '{print $1}' \
            /tmp/release-verification/desired-schema.zip.sha256
        )"

        DEPLOYSPEC_SHA="$(
          awk '{print $1}' \
            /tmp/release-verification/deployspec.yml.sha256
        )"

        DEPLOY_SCRIPT_SHA="$(
          awk '{print $1}' \
            /tmp/release-verification/deploy.sh.sha256
        )"

        if [ "${MANIFEST_DESIRED_ARTIFACT}" != "desired/desired-schema.zip" ]; then
          echo "ERROR - Unexpected desired schema artifact in manifest"
          echo "Value=${MANIFEST_DESIRED_ARTIFACT}"
          exit 1
        fi

        if [ "${MANIFEST_DESIRED_SHA}" != "${DESIRED_SHA}" ]; then
          echo "ERROR - Desired schema manifest SHA256 mismatch"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOYSPEC_ARTIFACT}" != "deployspec.yml" ]; then
          echo "ERROR - Unexpected deployment BuildSpec artifact"
          echo "Value=${MANIFEST_DEPLOYSPEC_ARTIFACT}"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOYSPEC_SHA}" != "${DEPLOYSPEC_SHA}" ]; then
          echo "ERROR - Deployment BuildSpec manifest SHA256 mismatch"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOY_SCRIPT_ARTIFACT}" != "deploy.sh" ]; then
          echo "ERROR - Unexpected deployment script artifact"
          echo "Value=${MANIFEST_DEPLOY_SCRIPT_ARTIFACT}"
          exit 1
        fi

        if [ "${MANIFEST_DEPLOY_SCRIPT_SHA}" != "${DEPLOY_SCRIPT_SHA}" ]; then
          echo "ERROR - Deployment script manifest SHA256 mismatch"
          exit 1
        fi

        echo "Manifest deployment metadata verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "EXTRACT DATABASE CONFIGURATION"
        echo "========================================"

        rm -rf /tmp/desired-schema

        mkdir -p /tmp/desired-schema

        unzip \
          -q \
          /tmp/release-verification/desired-schema.zip \
          -d /tmp/desired-schema

        CONFIG_FILE="$(
          find /tmp/desired-schema \
            -type f \
            -path "*/cicd/db/database-config.json" \
            -print \
            -quit
        )"

        if [ -z "${CONFIG_FILE}" ]; then
          echo "ERROR - database-config.json not found in desired bundle"
          exit 1
        fi

        if ! jq -e \
          'type == "object" and length > 0' \
          "${CONFIG_FILE}" \
          >/dev/null
        then
          echo "ERROR - Release database configuration is invalid"
          exit 1
        fi

        cp \
          "${CONFIG_FILE}" \
          /tmp/release-database-config.json

        echo "Release database configuration:"

        cat /tmp/release-database-config.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY COMPLETE DATABASE RELEASE"
        echo "========================================"

        VERIFIED_SCHEMAS=0

        while IFS= read -r DATABASE
        do
          if [ -z "${DATABASE}" ]; then
            continue
          fi

          if ! [[ "${DATABASE}" =~ ^[A-Za-z_][A-Za-z0-9_\$]*$ ]]; then
            echo "ERROR - Unsupported database identifier"
            echo "Database=${DATABASE}"
            exit 1
          fi

          while IFS= read -r SCHEMA
          do
            if [ -z "${SCHEMA}" ]; then
              echo "ERROR - Empty schema in release configuration"
              exit 1
            fi

            if ! [[ "${SCHEMA}" =~ ^[A-Za-z_][A-Za-z0-9_\$]*$ ]]; then
              echo "ERROR - Unsupported schema identifier"
              echo "Schema=${SCHEMA}"
              exit 1
            fi

            VERIFIED_SCHEMAS=$((VERIFIED_SCHEMAS + 1))

            echo "Verifying ${DATABASE}.${SCHEMA}"

            for relative_object in \
              "baseline/${DATABASE}/${SCHEMA}/schema.sql" \
              "baseline/${DATABASE}/${SCHEMA}/schema.sql.sha256" \
              "forward/${DATABASE}/${SCHEMA}/migration.sql" \
              "forward/${DATABASE}/${SCHEMA}/migration.sql.sha256" \
              "rollback/${DATABASE}/${SCHEMA}/rollback.sql" \
              "rollback/${DATABASE}/${SCHEMA}/rollback.sql.sha256"
            do
              OBJECT_KEY="${RELEASE_PREFIX}/${ENVIRONMENT}/${relative_object}"

              aws s3api head-object \
                --bucket "${RELEASE_BUCKET}" \
                --key "${OBJECT_KEY}" \
                >/dev/null

              echo "Verified s3://${RELEASE_BUCKET}/${OBJECT_KEY}"
            done

          done < <(
            jq -r \
              --arg database "${DATABASE}" \
              '.[$database][]' \
              /tmp/release-database-config.json
          )

        done < <(
          jq -r \
            'keys[]' \
            /tmp/release-database-config.json
        )

        if [ "${VERIFIED_SCHEMAS}" -eq 0 ]; then
          echo "ERROR - No database schemas were verified"
          exit 1
        fi

        echo "All configured release artifacts exist"
        echo "Verified schemas=${VERIFIED_SCHEMAS}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY SQL ARTIFACT CHECKSUMS"
        echo "========================================"

        rm -rf /tmp/sql-verification

        mkdir -p /tmp/sql-verification

        while IFS= read -r DATABASE
        do
          if [ -z "${DATABASE}" ]; then
            continue
          fi

          while IFS= read -r SCHEMA
          do
            if [ -z "${SCHEMA}" ]; then
              echo "ERROR - Empty schema in release configuration"
              exit 1
            fi

            VERIFY_DIR="/tmp/sql-verification/${DATABASE}/${SCHEMA}"

            mkdir -p "${VERIFY_DIR}"

            for artifact_type in \
              baseline \
              forward \
              rollback
            do
              case "${artifact_type}" in
                baseline)
                  SQL_NAME="schema.sql"
                  ;;

                forward)
                  SQL_NAME="migration.sql"
                  ;;

                rollback)
                  SQL_NAME="rollback.sql"
                  ;;

                *)
                  echo "ERROR - Unexpected artifact type ${artifact_type}"
                  exit 1
                  ;;
              esac

              BASE_URI="s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/${ENVIRONMENT}/${artifact_type}/${DATABASE}/${SCHEMA}"

              LOCAL_SQL="${VERIFY_DIR}/${artifact_type}-${SQL_NAME}"

              LOCAL_HASH="${LOCAL_SQL}.sha256"

              aws s3 cp \
                "${BASE_URI}/${SQL_NAME}" \
                "${LOCAL_SQL}"

              aws s3 cp \
                "${BASE_URI}/${SQL_NAME}.sha256" \
                "${LOCAL_HASH}"

              EXPECTED_SHA="$(
                awk '{print $1}' \
                  "${LOCAL_HASH}"
              )"

              ACTUAL_SHA="$(
                sha256sum \
                  "${LOCAL_SQL}" |
                awk '{print $1}'
              )"

              if ! [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "ERROR - Expected SHA256 is invalid"
                echo "Artifact=${artifact_type}"
                echo "Database=${DATABASE}"
                echo "Schema=${SCHEMA}"
                exit 1
              fi

              if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
                echo "ERROR - SQL artifact checksum mismatch"
                echo "Artifact=${artifact_type}"
                echo "Database=${DATABASE}"
                echo "Schema=${SCHEMA}"
                echo "Expected=${EXPECTED_SHA}"
                echo "Actual=${ACTUAL_SHA}"
                exit 1
              fi

              echo "Checksum verified for ${artifact_type} ${DATABASE}.${SCHEMA}"
            done

          done < <(
            jq -r \
              --arg database "${DATABASE}" \
              '.[$database][]' \
              /tmp/release-database-config.json
          )

        done < <(
          jq -r \
            'keys[]' \
            /tmp/release-database-config.json
        )

        echo "All SQL artifact checksums verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "CREATE PENDING RELEASE POINTER"
        echo "========================================"

        jq -n \
          --arg release_branch "${RELEASE_BRANCH}" \
          --arg release_commit "${RELEASE_COMMIT}" \
          --arg release_prefix "${RELEASE_PREFIX}" \
          --arg plan_environment "${ENVIRONMENT}" \
          '{
            release_branch: $release_branch,
            release_commit: $release_commit,
            release_prefix: $release_prefix,
            plan_environment: $plan_environment
          }' \
          > /tmp/pending-release.json

        if ! jq -e \
          '
          (.release_branch | type == "string" and length > 0)
          and
          (.release_commit | test("^[0-9a-fA-F]{40}$"))
          and
          (.release_prefix | type == "string" and length > 0)
          and
          (.plan_environment == "T1" or .plan_environment == "T2")
          ' \
          /tmp/pending-release.json \
          >/dev/null
        then
          echo "ERROR - Pending release pointer is invalid"
          exit 1
        fi

        echo "Pending release pointer:"

        cat /tmp/pending-release.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "PUBLISH PENDING RELEASE POINTER"
        echo "========================================"

        PENDING_KEY="pending-release/current.json"

        aws s3 cp \
          /tmp/pending-release.json \
          "s3://${RELEASE_BUCKET}/${PENDING_KEY}"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${PENDING_KEY}" \
          /tmp/verify-pending-release.json

        if ! cmp -s \
          /tmp/pending-release.json \
          /tmp/verify-pending-release.json
        then
          echo "ERROR - Published pending pointer verification failed"
          exit 1
        fi

        echo "Pending release pointer published and verified:"
        echo "s3://${RELEASE_BUCKET}/${PENDING_KEY}"


      - |
        echo "========================================"
        echo "DATABASE GENERATE LAUNCHER COMPLETE"
        echo "========================================"

        echo "Release branch:"
        echo "${RELEASE_BRANCH}"

        echo "Release commit:"
        echo "${RELEASE_COMMIT}"

        echo "Plan environment:"
        echo "${ENVIRONMENT}"

        echo "Pending release pointer:"
        echo "s3://${RELEASE_BUCKET}/pending-release/current.json"

        echo "The following release components were verified:"
        echo "- desired schema bundle"
        echo "- deployspec.yml"
        echo "- deploy.sh"
        echo "- baseline schemas"
        echo "- forward migrations"
        echo "- rollback migrations"
        echo "- all associated checksums"

        echo "The complete release can now"
        echo "proceed to Manual Approval."
