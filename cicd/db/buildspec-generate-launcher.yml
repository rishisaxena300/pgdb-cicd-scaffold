version: 0.2

env:
  shell: bash

phases:

  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "DATABASE GENERATE LAUNCHER"
        echo "========================================"

        for variable in \
          RELEASE_BRANCH \
          ENVIRONMENT \
          GENERATE_PROJECT \
          RELEASE_BUCKET
        do

          if [ -z "${!variable:-}" ]; then
            echo "ERROR - ${variable} is missing"
            exit 1
          fi

        done

        if [ "${RELEASE_BRANCH}" = "placeholder" ]; then
          echo "ERROR - RELEASE_BRANCH was not overridden"
          exit 1
        fi

        if [ "${ENVIRONMENT}" = "placeholder" ]; then
          echo "ERROR - ENVIRONMENT was not overridden"
          exit 1
        fi

        RELEASE_BRANCH="$(
          printf '%s' "${RELEASE_BRANCH}" |
          xargs
        )"

        ENVIRONMENT="$(
          printf '%s' "${ENVIRONMENT}" |
          xargs |
          tr '[:lower:]' '[:upper:]'
        )"

        GENERATE_PROJECT="$(
          printf '%s' "${GENERATE_PROJECT}" |
          xargs
        )"

        RELEASE_BUCKET="$(
          printf '%s' "${RELEASE_BUCKET}" |
          xargs
        )"

        export RELEASE_BRANCH
        export ENVIRONMENT
        export GENERATE_PROJECT
        export RELEASE_BUCKET

        case "${ENVIRONMENT}" in

          T1|T2)
            ;;

          *)
            echo "ERROR - ENVIRONMENT must be T1 or T2"
            echo "Received value is '${ENVIRONMENT}'"
            exit 1
            ;;

        esac

        echo "RELEASE_BRANCH=${RELEASE_BRANCH}"
        echo "ENVIRONMENT=${ENVIRONMENT}"
        echo "GENERATE_PROJECT=${GENERATE_PROJECT}"
        echo "RELEASE_BUCKET=${RELEASE_BUCKET}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "START DATABASE GENERATE BUILD"
        echo "========================================"

        BUILD_ID="$(
          aws codebuild start-build \
            --project-name "${GENERATE_PROJECT}" \
            --source-version "${RELEASE_BRANCH}" \
            --environment-variables-override \
              name=RELEASE_BRANCH,value="${RELEASE_BRANCH}",type=PLAINTEXT \
              name=ENVIRONMENT,value="${ENVIRONMENT}",type=PLAINTEXT \
            --query 'build.id' \
            --output text
        )"

        if [ -z "${BUILD_ID}" ] || \
           [ "${BUILD_ID}" = "None" ]
        then
          echo "ERROR - No child build ID returned"
          exit 1
        fi

        printf '%s\n' "${BUILD_ID}" \
          > /tmp/generate-build-id

        echo "BUILD_ID=${BUILD_ID}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "WAIT FOR DATABASE GENERATE BUILD"
        echo "========================================"

        BUILD_ID="$(
          cat /tmp/generate-build-id
        )"

        while true
        do

          BUILD_STATUS="$(
            aws codebuild batch-get-builds \
              --ids "${BUILD_ID}" \
              --query 'builds[0].buildStatus' \
              --output text
          )"

          echo "Generate status=${BUILD_STATUS}"

          case "${BUILD_STATUS}" in

            SUCCEEDED)
              echo "Generate build succeeded"
              break
              ;;

            FAILED|FAULT|STOPPED|TIMED_OUT)
              echo "ERROR - Generate build ${BUILD_STATUS}"
              exit 1
              ;;

            IN_PROGRESS)
              sleep 10
              ;;

            *)
              echo "ERROR - Unexpected Generate status '${BUILD_STATUS}'"
              exit 1
              ;;

          esac

        done


      - |
        set -euo pipefail

        echo "========================================"
        echo "GET GENERATED RELEASE INFORMATION"
        echo "========================================"

        BUILD_ID="$(
          cat /tmp/generate-build-id
        )"

        RELEASE_COMMIT="$(
          aws codebuild batch-get-builds \
            --ids "${BUILD_ID}" \
            --query 'builds[0].resolvedSourceVersion' \
            --output text
        )"

        SOURCE_VERSION="$(
          aws codebuild batch-get-builds \
            --ids "${BUILD_ID}" \
            --query 'builds[0].sourceVersion' \
            --output text
        )"

        if [ -z "${RELEASE_COMMIT}" ] || \
           [ "${RELEASE_COMMIT}" = "None" ]
        then
          echo "ERROR - Unable to determine release commit"
          exit 1
        fi

        if [ -z "${SOURCE_VERSION}" ] || \
           [ "${SOURCE_VERSION}" = "None" ]
        then
          echo "ERROR - Unable to determine child source version"
          exit 1
        fi

        if [ "${SOURCE_VERSION}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - Child build source version mismatch"
          echo "Requested branch is ${RELEASE_BRANCH}"
          echo "Child source version is ${SOURCE_VERSION}"
          exit 1
        fi

        if ! [[ "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "ERROR - Child resolved source version is not a full Git commit"
          echo "Resolved source version is ${RELEASE_COMMIT}"
          exit 1
        fi

        RELEASE_BRANCH_KEY="$(
          printf '%s' "${RELEASE_BRANCH}" |
          tr '/' '-'
        )"

        if [ -z "${RELEASE_BRANCH_KEY}" ]; then
          echo "ERROR - Unable to create release branch key"
          exit 1
        fi

        SHORT_COMMIT="${RELEASE_COMMIT:0:8}"

        RELEASE_PREFIX="releases/${RELEASE_BRANCH_KEY}/${SHORT_COMMIT}"

        echo "RELEASE_BRANCH=${RELEASE_BRANCH}"
        echo "SOURCE_VERSION=${SOURCE_VERSION}"
        echo "RELEASE_COMMIT=${RELEASE_COMMIT}"
        echo "RELEASE_PREFIX=${RELEASE_PREFIX}"

        jq -n \
          --arg release_branch "${RELEASE_BRANCH}" \
          --arg release_branch_key "${RELEASE_BRANCH_KEY}" \
          --arg environment "${ENVIRONMENT}" \
          --arg release_commit "${RELEASE_COMMIT}" \
          --arg release_prefix "${RELEASE_PREFIX}" \
          --arg generate_build_id "${BUILD_ID}" \
          '{
            release_branch: $release_branch,
            release_branch_key: $release_branch_key,
            environment: $environment,
            release_commit: $release_commit,
            release_prefix: $release_prefix,
            generate_build_id: $generate_build_id
          }' \
          > /tmp/generated-release.json

        echo "Generated release metadata:"

        cat /tmp/generated-release.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY RELEASE-LEVEL ARTIFACTS"
        echo "========================================"

        RELEASE_PREFIX="$(
          jq -r \
            '.release_prefix' \
            /tmp/generated-release.json
        )"

        RELEASE_COMMIT="$(
          jq -r \
            '.release_commit' \
            /tmp/generated-release.json
        )"

        echo "Release location:"
        echo "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/"

        for object_key in \
          "${RELEASE_PREFIX}/manifest.json" \
          "${RELEASE_PREFIX}/desired/desired-schema.zip" \
          "${RELEASE_PREFIX}/desired/desired-schema.zip.sha256"
        do

          aws s3api head-object \
            --bucket "${RELEASE_BUCKET}" \
            --key "${object_key}" \
            >/dev/null

          echo "Verified s3://${RELEASE_BUCKET}/${object_key}"

        done

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/manifest.json" \
          /tmp/db-release-manifest.json

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip" \
          /tmp/desired-schema.zip

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip.sha256" \
          /tmp/desired-schema.zip.sha256

        echo "Release-level artifacts downloaded"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY DESIRED SCHEMA BUNDLE CHECKSUM"
        echo "========================================"

        EXPECTED_DESIRED_SHA="$(
          awk '{print $1}' \
            /tmp/desired-schema.zip.sha256
        )"

        ACTUAL_DESIRED_SHA="$(
          sha256sum \
            /tmp/desired-schema.zip |
          awk '{print $1}'
        )"

        if [ -z "${EXPECTED_DESIRED_SHA}" ]; then
          echo "ERROR - Desired schema expected SHA256 is empty"
          exit 1
        fi

        if [ "${EXPECTED_DESIRED_SHA}" != "${ACTUAL_DESIRED_SHA}" ]; then
          echo "ERROR - Desired schema bundle checksum mismatch"
          echo "Expected=${EXPECTED_DESIRED_SHA}"
          echo "Actual=${ACTUAL_DESIRED_SHA}"
          exit 1
        fi

        echo "Desired schema bundle checksum verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY MANIFEST IDENTITY"
        echo "========================================"

        RELEASE_COMMIT="$(
          jq -r \
            '.release_commit' \
            /tmp/generated-release.json
        )"

        MANIFEST_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            /tmp/db-release-manifest.json
        )"

        MANIFEST_COMMIT="$(
          jq -r \
            '.git_commit // empty' \
            /tmp/db-release-manifest.json
        )"

        if [ "${MANIFEST_BRANCH}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - Manifest release branch mismatch"
          echo "Requested=${RELEASE_BRANCH}"
          echo "Manifest=${MANIFEST_BRANCH}"
          exit 1
        fi

        if [ "${MANIFEST_COMMIT}" != "${RELEASE_COMMIT}" ]; then
          echo "ERROR - Manifest commit mismatch"
          echo "Child build=${RELEASE_COMMIT}"
          echo "Manifest=${MANIFEST_COMMIT}"
          exit 1
        fi

        echo "Manifest release identity verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "EXTRACT RELEASE DATABASE CONFIGURATION"
        echo "========================================"

        rm -rf /tmp/desired-schema

        mkdir -p /tmp/desired-schema

        unzip \
          -q \
          /tmp/desired-schema.zip \
          -d /tmp/desired-schema

        CONFIG_FILE="$(
          find /tmp/desired-schema \
            -type f \
            -path "*/cicd/db/database-config.json" \
            -print \
            -quit
        )"

        if [ -z "${CONFIG_FILE}" ]; then
          echo "ERROR - database-config.json not found in desired schema bundle"
          exit 1
        fi

        if ! jq -e \
          'type == "object" and length > 0' \
          "${CONFIG_FILE}" \
          >/dev/null
        then
          echo "ERROR - Database configuration in desired bundle is invalid"
          exit 1
        fi

        cp \
          "${CONFIG_FILE}" \
          /tmp/release-database-config.json

        echo "Release database configuration:"

        cat /tmp/release-database-config.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY COMPLETE DATABASE RELEASE"
        echo "========================================"

        RELEASE_PREFIX="$(
          jq -r \
            '.release_prefix' \
            /tmp/generated-release.json
        )"

        DATABASE_COUNT=0
        SCHEMA_COUNT=0
        OBJECT_COUNT=0

        while IFS= read -r DATABASE
        do

          if [ -z "${DATABASE}" ]; then
            continue
          fi

          DATABASE_COUNT=$((DATABASE_COUNT + 1))

          while IFS= read -r SCHEMA
          do

            if [ -z "${SCHEMA}" ]; then
              echo "ERROR - Empty schema in release database configuration"
              exit 1
            fi

            SCHEMA_COUNT=$((SCHEMA_COUNT + 1))

            echo "Verifying ${DATABASE}.${SCHEMA}"

            for relative_object in \
              "baseline/${DATABASE}/${SCHEMA}/schema.sql" \
              "baseline/${DATABASE}/${SCHEMA}/schema.sql.sha256" \
              "forward/${DATABASE}/${SCHEMA}/migration.sql" \
              "forward/${DATABASE}/${SCHEMA}/migration.sql.sha256" \
              "rollback/${DATABASE}/${SCHEMA}/rollback.sql" \
              "rollback/${DATABASE}/${SCHEMA}/rollback.sql.sha256"
            do

              OBJECT_KEY="${RELEASE_PREFIX}/${ENVIRONMENT}/${relative_object}"

              aws s3api head-object \
                --bucket "${RELEASE_BUCKET}" \
                --key "${OBJECT_KEY}" \
                >/dev/null

              OBJECT_COUNT=$((OBJECT_COUNT + 1))

              echo "Verified s3://${RELEASE_BUCKET}/${OBJECT_KEY}"

            done

          done < <(
            jq -r \
              --arg database "${DATABASE}" \
              '.[$database][]' \
              /tmp/release-database-config.json
          )

        done < <(
          jq -r \
            'keys[]' \
            /tmp/release-database-config.json
        )

        if [ "${DATABASE_COUNT}" -eq 0 ]; then
          echo "ERROR - No databases were verified"
          exit 1
        fi

        if [ "${SCHEMA_COUNT}" -eq 0 ]; then
          echo "ERROR - No schemas were verified"
          exit 1
        fi

        EXPECTED_OBJECT_COUNT=$((SCHEMA_COUNT * 6))

        if [ "${OBJECT_COUNT}" -ne "${EXPECTED_OBJECT_COUNT}" ]; then
          echo "ERROR - Verified object count mismatch"
          echo "Expected=${EXPECTED_OBJECT_COUNT}"
          echo "Actual=${OBJECT_COUNT}"
          exit 1
        fi

        echo "Complete database release verified"
        echo "Database count=${DATABASE_COUNT}"
        echo "Schema count=${SCHEMA_COUNT}"
        echo "Verified object count=${OBJECT_COUNT}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY SQL ARTIFACT CHECKSUMS"
        echo "========================================"

        RELEASE_PREFIX="$(
          jq -r \
            '.release_prefix' \
            /tmp/generated-release.json
        )"

        rm -rf /tmp/sql-artifact-verification

        mkdir -p /tmp/sql-artifact-verification

        while IFS= read -r DATABASE
        do

          while IFS= read -r SCHEMA
          do

            VERIFY_DIR="/tmp/sql-artifact-verification/${DATABASE}/${SCHEMA}"

            mkdir -p "${VERIFY_DIR}"

            for artifact_type in \
              baseline \
              forward \
              rollback
            do

              case "${artifact_type}" in

                baseline)
                  SQL_NAME="schema.sql"
                  ;;

                forward)
                  SQL_NAME="migration.sql"
                  ;;

                rollback)
                  SQL_NAME="rollback.sql"
                  ;;

                *)
                  echo "ERROR - Unexpected artifact type ${artifact_type}"
                  exit 1
                  ;;

              esac

              BASE_URI="s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/${ENVIRONMENT}/${artifact_type}/${DATABASE}/${SCHEMA}"

              aws s3 cp \
                "${BASE_URI}/${SQL_NAME}" \
                "${VERIFY_DIR}/${artifact_type}-${SQL_NAME}"

              aws s3 cp \
                "${BASE_URI}/${SQL_NAME}.sha256" \
                "${VERIFY_DIR}/${artifact_type}-${SQL_NAME}.sha256"

              EXPECTED_SHA="$(
                awk '{print $1}' \
                  "${VERIFY_DIR}/${artifact_type}-${SQL_NAME}.sha256"
              )"

              ACTUAL_SHA="$(
                sha256sum \
                  "${VERIFY_DIR}/${artifact_type}-${SQL_NAME}" |
                awk '{print $1}'
              )"

              if [ -z "${EXPECTED_SHA}" ]; then
                echo "ERROR - Expected SHA256 is empty"
                echo "${artifact_type} ${DATABASE}.${SCHEMA}"
                exit 1
              fi

              if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
                echo "ERROR - SQL artifact checksum mismatch"
                echo "Artifact=${artifact_type}"
                echo "Database=${DATABASE}"
                echo "Schema=${SCHEMA}"
                echo "Expected=${EXPECTED_SHA}"
                echo "Actual=${ACTUAL_SHA}"
                exit 1
              fi

              echo "Checksum verified for ${artifact_type} ${DATABASE}.${SCHEMA}"

            done

          done < <(
            jq -r \
              --arg database "${DATABASE}" \
              '.[$database][]' \
              /tmp/release-database-config.json
          )

        done < <(
          jq -r \
            'keys[]' \
            /tmp/release-database-config.json
        )

        echo "All baseline, forward, and rollback checksums verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "CREATE PENDING DATABASE RELEASE POINTER"
        echo "========================================"

        RELEASE_PREFIX="$(
          jq -r \
            '.release_prefix' \
            /tmp/generated-release.json
        )"

        RELEASE_COMMIT="$(
          jq -r \
            '.release_commit' \
            /tmp/generated-release.json
        )"

        RELEASE_BRANCH_KEY="$(
          jq -r \
            '.release_branch_key' \
            /tmp/generated-release.json
        )"

        BUILD_ID="$(
          jq -r \
            '.generate_build_id' \
            /tmp/generated-release.json
        )"

        DATABASE_COUNT="$(
          jq \
            'keys | length' \
            /tmp/release-database-config.json
        )"

        SCHEMA_COUNT="$(
          jq \
            '[.[] | length] | add' \
            /tmp/release-database-config.json
        )"

        jq -n \
          --arg release_branch "${RELEASE_BRANCH}" \
          --arg release_branch_key "${RELEASE_BRANCH_KEY}" \
          --arg environment "${ENVIRONMENT}" \
          --arg release_commit "${RELEASE_COMMIT}" \
          --arg release_prefix "${RELEASE_PREFIX}" \
          --arg generate_build_id "${BUILD_ID}" \
          --argjson database_count "${DATABASE_COUNT}" \
          --argjson schema_count "${SCHEMA_COUNT}" \
          '{
            release_branch: $release_branch,
            release_branch_key: $release_branch_key,
            environment: $environment,
            release_commit: $release_commit,
            release_prefix: $release_prefix,
            generate_build_id: $generate_build_id,
            database_count: $database_count,
            schema_count: $schema_count,
            release_complete: true
          }' \
          > /tmp/pending-release.json

        echo "Pending release metadata:"

        cat /tmp/pending-release.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "PUBLISH PENDING DATABASE RELEASE POINTER"
        echo "========================================"

        PIPELINE_EXECUTION_ID="${CODEBUILD_INITIATOR#codepipeline/}"

        if [ -z "${PIPELINE_EXECUTION_ID}" ] || \
           [ "${PIPELINE_EXECUTION_ID}" = "${CODEBUILD_INITIATOR}" ]
        then
          echo "WARNING - Unable to derive pipeline execution ID"
          echo "Publishing environment current pointer only"

        else

          aws s3 cp \
            /tmp/pending-release.json \
            "s3://${RELEASE_BUCKET}/pending-release/${ENVIRONMENT}/executions/${PIPELINE_EXECUTION_ID}.json"

          echo "Execution-specific pending pointer published"

        fi

        aws s3 cp \
          /tmp/pending-release.json \
          "s3://${RELEASE_BUCKET}/pending-release/${ENVIRONMENT}/current.json"

        echo "Current pending release pointer published"


      - |
        echo "========================================"
        echo "DATABASE GENERATE LAUNCHER COMPLETE"
        echo "========================================"

        echo "Release branch:"
        echo "${RELEASE_BRANCH}"

        echo "Environment:"
        echo "${ENVIRONMENT}"

        echo "Release:"
        jq -r \
          '.release_prefix' \
          /tmp/pending-release.json

        echo "Baseline, forward migration, rollback,"
        echo "and all checksums were verified."

        echo "The complete database release can now"
        echo "proceed to Manual Approval."
