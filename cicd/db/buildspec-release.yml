version: 0.2

env:
  shell: bash

phases:

  install:
    commands:
      - set -euo pipefail

      - echo "=========================================="
      - echo "INSTALL P1 RELEASE BUILD UTILITIES"
      - echo "=========================================="

      - apt-get update

      - >
        DEBIAN_FRONTEND=noninteractive apt-get install -y
        jq
        zip
        ca-certificates

      - jq --version
      - zip -v | head -1
      - aws --version

  pre_build:
    commands:
      - set -euo pipefail

      - echo "=========================================="
      - echo "VALIDATE RELEASE INPUT"
      - echo "=========================================="

      - test -n "${RELEASE_BRANCH}"
      - test -n "${RELEASE_BUCKET}"

      - echo "Release branch: ${RELEASE_BRANCH}"

      - chmod +x cicd/scripts/create_release.sh

  build:
    commands:
      - set -euo pipefail

      - echo "=========================================="
      - echo "CREATE DATABASE RELEASE"
      - echo "=========================================="

      - cicd/scripts/create_release.sh

artifacts:
  files:
    - "output/**/*"
