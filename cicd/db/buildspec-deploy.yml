version: 0.2

env:
  shell: bash

phases:

  install:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "BACH DB CI/CD - DEPLOY"
        echo "========================================"

        echo "========================================"
        echo "VERIFY BASE CODEBUILD TOOLS"
        echo "========================================"

        command -v aws
        command -v jq
        command -v unzip
        command -v curl

        aws --version
        jq --version

        echo "========================================"
        echo "INSTALL POSTGRESQL CLIENT PREREQUISITES"
        echo "========================================"

        UBUNTU_SOURCE_FILE="/etc/apt/sources.list.d/ubuntu.sources"

        if [ ! -f "${UBUNTU_SOURCE_FILE}" ]; then
          echo "ERROR - Ubuntu APT source file is missing"
          echo "Expected ${UBUNTU_SOURCE_FILE}"
          exit 1
        fi

        apt-get \
          -o Dir::Etc::sourcelist="${UBUNTU_SOURCE_FILE}" \
          -o Dir::Etc::sourceparts="-" \
          update

        DEBIAN_FRONTEND=noninteractive \
        apt-get \
          -o Dir::Etc::sourcelist="${UBUNTU_SOURCE_FILE}" \
          -o Dir::Etc::sourceparts="-" \
          install -y \
          curl \
          ca-certificates \
          gpg \
          unzip

        echo "========================================"
        echo "CONFIGURE POSTGRESQL PGDG REPOSITORY"
        echo "========================================"

        install \
          -d \
          -m 0755 \
          /usr/share/postgresql-common/pgdg

        curl \
          --fail \
          --silent \
          --show-error \
          --location \
          --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc

        cat > /etc/apt/sources.list.d/pgdg.sources <<'EOF'
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: noble-pgdg
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF

        echo "========================================"
        echo "INSTALL POSTGRESQL CLIENT 17"
        echo "========================================"

        apt-get \
          -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/pgdg.sources" \
          -o Dir::Etc::sourceparts="-" \
          update

        DEBIAN_FRONTEND=noninteractive \
        apt-get \
          -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/pgdg.sources" \
          -o Dir::Etc::sourceparts="-" \
          install -y \
          postgresql-client-17

        POSTGRES_BIN_DIR="/usr/lib/postgresql/17/bin"

        if [ ! -x "${POSTGRES_BIN_DIR}/psql" ]; then
          echo "ERROR - psql was not installed"
          echo "Expected ${POSTGRES_BIN_DIR}/psql"
          exit 1
        fi

        if [ ! -x "${POSTGRES_BIN_DIR}/pg_dump" ]; then
          echo "ERROR - pg_dump was not installed"
          echo "Expected ${POSTGRES_BIN_DIR}/pg_dump"
          exit 1
        fi

        ln -sfn \
          "${POSTGRES_BIN_DIR}/psql" \
          /usr/local/bin/psql

        ln -sfn \
          "${POSTGRES_BIN_DIR}/pg_dump" \
          /usr/local/bin/pg_dump

        echo "========================================"
        echo "VERIFY POSTGRESQL CLIENT"
        echo "========================================"

        command -v psql
        command -v pg_dump

        psql --version
        pg_dump --version

        INSTALLED_POSTGRES_MAJOR="$(
          pg_dump --version |
          awk '{print $3}' |
          cut -d. -f1
        )"

        if [ "${INSTALLED_POSTGRES_MAJOR}" != "17" ]; then
          echo "ERROR - Expected PostgreSQL client 17"
          echo "Installed major is ${INSTALLED_POSTGRES_MAJOR}"
          exit 1
        fi

        echo "Deployment tooling is ready"


  pre_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE DEPLOYMENT INPUT"
        echo "========================================"

        for variable in \
          RELEASE_BUCKET \
          TARGET_ENVIRONMENT \
          TARGET_ROLE_ARN \
          DEPLOY_SECRET_ID
        do

          if [ -z "${!variable:-}" ]; then
            echo "ERROR - ${variable} is required"
            exit 1
          fi

        done

        TARGET_ENVIRONMENT="$(
          printf '%s' "${TARGET_ENVIRONMENT}" |
          xargs |
          tr '[:lower:]' '[:upper:]'
        )"

        export TARGET_ENVIRONMENT

        case "${TARGET_ENVIRONMENT}" in

          T1|T2|STAGING|PRODUCTION)
            ;;

          *)
            echo "ERROR - Unsupported TARGET_ENVIRONMENT"
            echo "Received value is '${TARGET_ENVIRONMENT}'"
            exit 1
            ;;

        esac

        echo "Release bucket=${RELEASE_BUCKET}"
        echo "Target environment=${TARGET_ENVIRONMENT}"
        echo "Target role=${TARGET_ROLE_ARN}"
        echo "Deploy secret=${DEPLOY_SECRET_ID}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY PACKAGED DEPLOY SCRIPT"
        echo "========================================"

        if [ ! -f "deploy.sh" ]; then
          echo "ERROR - deploy.sh is missing from release artifact"
          exit 1
        fi

        if [ ! -s "deploy.sh" ]; then
          echo "ERROR - deploy.sh is empty"
          exit 1
        fi

        chmod +x deploy.sh

        echo "deploy.sh is ready"


  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "RUN APPROVED DATABASE DEPLOYMENT"
        echo "========================================"

        ./deploy.sh


  post_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "DATABASE DEPLOY BUILDSPEC COMPLETE"
        echo "========================================"

        echo "Target environment=${TARGET_ENVIRONMENT}"
