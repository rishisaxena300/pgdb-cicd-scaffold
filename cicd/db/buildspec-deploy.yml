version: 0.2

env:
  shell: bash

phases:

  install:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "T1 DATABASE DEPLOYMENT"
        echo "========================================"

        echo "========================================"
        echo "VERIFY BASE TOOLS"
        echo "========================================"

        command -v aws
        command -v jq
        command -v unzip
        command -v curl

        aws --version
        jq --version

        echo "========================================"
        echo "INSTALL POSTGRESQL CLIENT 17"
        echo "========================================"

        UBUNTU_SOURCE_FILE="/etc/apt/sources.list.d/ubuntu.sources"

        if [ ! -f "${UBUNTU_SOURCE_FILE}" ]; then
          echo "ERROR - Ubuntu APT source file is missing"
          echo "Expected ${UBUNTU_SOURCE_FILE}"
          exit 1
        fi

        apt-get \
          -o Dir::Etc::sourcelist="${UBUNTU_SOURCE_FILE}" \
          -o Dir::Etc::sourceparts="-" \
          update

        DEBIAN_FRONTEND=noninteractive \
        apt-get \
          -o Dir::Etc::sourcelist="${UBUNTU_SOURCE_FILE}" \
          -o Dir::Etc::sourceparts="-" \
          install -y \
          curl \
          ca-certificates \
          gpg

        install \
          -d \
          -m 0755 \
          /usr/share/postgresql-common/pgdg

        curl \
          --fail \
          --silent \
          --show-error \
          --location \
          --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc

        cat > /etc/apt/sources.list.d/pgdg.sources <<'EOF'
        Types: deb
        URIs: https://apt.postgresql.org/pub/repos/apt
        Suites: noble-pgdg
        Components: main
        Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        EOF

        apt-get \
          -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/pgdg.sources" \
          -o Dir::Etc::sourceparts="-" \
          update

        DEBIAN_FRONTEND=noninteractive \
        apt-get \
          -o Dir::Etc::sourcelist="/etc/apt/sources.list.d/pgdg.sources" \
          -o Dir::Etc::sourceparts="-" \
          install -y \
          postgresql-client-17

        POSTGRES_BIN_DIR="/usr/lib/postgresql/17/bin"

        if [ ! -x "${POSTGRES_BIN_DIR}/psql" ]; then
          echo "ERROR - PostgreSQL 17 psql was not installed"
          exit 1
        fi

        if [ ! -x "${POSTGRES_BIN_DIR}/pg_dump" ]; then
          echo "ERROR - PostgreSQL 17 pg_dump was not installed"
          exit 1
        fi

        ln -sfn \
          "${POSTGRES_BIN_DIR}/psql" \
          /usr/local/bin/psql

        ln -sfn \
          "${POSTGRES_BIN_DIR}/pg_dump" \
          /usr/local/bin/pg_dump

        command -v psql
        command -v pg_dump

        psql --version
        pg_dump --version


  pre_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "VALIDATE DEPLOYMENT CONFIGURATION"
        echo "========================================"

        for variable in \
          RELEASE_BUCKET \
          TARGET_ENVIRONMENT \
          TARGET_ROLE_ARN \
          DEPLOY_SECRET_ID
        do
          if [ -z "${!variable:-}" ]; then
            echo "ERROR - ${variable} is required"
            exit 1
          fi
        done

        RELEASE_BUCKET="$(
          printf '%s' "${RELEASE_BUCKET}" |
          xargs
        )"

        TARGET_ENVIRONMENT="$(
          printf '%s' "${TARGET_ENVIRONMENT}" |
          xargs |
          tr '[:lower:]' '[:upper:]'
        )"

        TARGET_ROLE_ARN="$(
          printf '%s' "${TARGET_ROLE_ARN}" |
          xargs
        )"

        DEPLOY_SECRET_ID="$(
          printf '%s' "${DEPLOY_SECRET_ID}" |
          xargs
        )"

        export RELEASE_BUCKET
        export TARGET_ENVIRONMENT
        export TARGET_ROLE_ARN
        export DEPLOY_SECRET_ID

        if [ "${TARGET_ENVIRONMENT}" != "T1" ]; then
          echo "ERROR - This deployment project is restricted to T1"
          echo "Received target environment is ${TARGET_ENVIRONMENT}"
          exit 1
        fi

        echo "Release bucket=${RELEASE_BUCKET}"
        echo "Target environment=${TARGET_ENVIRONMENT}"
        echo "Target role=${TARGET_ROLE_ARN}"
        echo "Deploy secret=${DEPLOY_SECRET_ID}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "DOWNLOAD APPROVED RELEASE POINTER"
        echo "========================================"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/approved-release/current.json" \
          /tmp/approved-release.json

        if ! jq -e . \
          /tmp/approved-release.json \
          >/dev/null
        then
          echo "ERROR - Approved release pointer is invalid JSON"
          exit 1
        fi

        APPROVED="$(
          jq -r \
            '.approved // false' \
            /tmp/approved-release.json
        )"

        RELEASE_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            /tmp/approved-release.json
        )"

        RELEASE_COMMIT="$(
          jq -r \
            '.release_commit // empty' \
            /tmp/approved-release.json
        )"

        RELEASE_PREFIX="$(
          jq -r \
            '.release_prefix // empty' \
            /tmp/approved-release.json
        )"

        PLAN_ENVIRONMENT="$(
          jq -r \
            '.plan_environment // empty' \
            /tmp/approved-release.json
        )"

        if [ "${APPROVED}" != "true" ]; then
          echo "ERROR - Release is not approved"
          exit 1
        fi

        if [ -z "${RELEASE_BRANCH}" ]; then
          echo "ERROR - release_branch is missing"
          exit 1
        fi

        if ! [[ "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "ERROR - release_commit is invalid"
          echo "Received value is ${RELEASE_COMMIT}"
          exit 1
        fi

        if [ -z "${RELEASE_PREFIX}" ]; then
          echo "ERROR - release_prefix is missing"
          exit 1
        fi

        case "${PLAN_ENVIRONMENT}" in
          T1|T2)
            ;;
          *)
            echo "ERROR - plan_environment must be T1 or T2"
            echo "Received value is ${PLAN_ENVIRONMENT}"
            exit 1
            ;;
        esac

        export RELEASE_BRANCH
        export RELEASE_COMMIT
        export RELEASE_PREFIX
        export PLAN_ENVIRONMENT

        echo "Release branch=${RELEASE_BRANCH}"
        echo "Release commit=${RELEASE_COMMIT}"
        echo "Release prefix=${RELEASE_PREFIX}"
        echo "Plan environment=${PLAN_ENVIRONMENT}"


      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY APPROVED RELEASE MANIFEST"
        echo "========================================"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/manifest.json" \
          /tmp/release-manifest.json

        if ! jq -e . \
          /tmp/release-manifest.json \
          >/dev/null
        then
          echo "ERROR - Release manifest is invalid JSON"
          exit 1
        fi

        MANIFEST_BRANCH="$(
          jq -r \
            '.release_branch // empty' \
            /tmp/release-manifest.json
        )"

        MANIFEST_COMMIT="$(
          jq -r \
            '.git_commit // empty' \
            /tmp/release-manifest.json
        )"

        if [ "${MANIFEST_BRANCH}" != "${RELEASE_BRANCH}" ]; then
          echo "ERROR - Release branch does not match manifest"
          echo "Approved=${RELEASE_BRANCH}"
          echo "Manifest=${MANIFEST_BRANCH}"
          exit 1
        fi

        if [ "${MANIFEST_COMMIT}" != "${RELEASE_COMMIT}" ]; then
          echo "ERROR - Release commit does not match manifest"
          echo "Approved=${RELEASE_COMMIT}"
          echo "Manifest=${MANIFEST_COMMIT}"
          exit 1
        fi

        echo "Approved release manifest verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "DOWNLOAD DESIRED SCHEMA BUNDLE"
        echo "========================================"

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip" \
          /tmp/desired-schema.zip

        aws s3 cp \
          "s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/desired/desired-schema.zip.sha256" \
          /tmp/desired-schema.zip.sha256

        EXPECTED_DESIRED_SHA="$(
          awk '{print $1}' \
            /tmp/desired-schema.zip.sha256
        )"

        ACTUAL_DESIRED_SHA="$(
          sha256sum \
            /tmp/desired-schema.zip |
          awk '{print $1}'
        )"

        if [ -z "${EXPECTED_DESIRED_SHA}" ]; then
          echo "ERROR - Desired schema expected SHA256 is empty"
          exit 1
        fi

        if [ "${EXPECTED_DESIRED_SHA}" != "${ACTUAL_DESIRED_SHA}" ]; then
          echo "ERROR - Desired schema checksum mismatch"
          echo "Expected=${EXPECTED_DESIRED_SHA}"
          echo "Actual=${ACTUAL_DESIRED_SHA}"
          exit 1
        fi

        rm -rf /tmp/desired-schema

        mkdir -p /tmp/desired-schema

        unzip \
          -q \
          /tmp/desired-schema.zip \
          -d /tmp/desired-schema

        CONFIG_FILE="$(
          find /tmp/desired-schema \
            -type f \
            -path "*/cicd/db/database-config.json" \
            -print \
            -quit
        )"

        if [ -z "${CONFIG_FILE}" ]; then
          echo "ERROR - database-config.json was not found"
          exit 1
        fi

        if ! jq -e \
          'type == "object" and length > 0' \
          "${CONFIG_FILE}" \
          >/dev/null
        then
          echo "ERROR - database-config.json is invalid"
          exit 1
        fi

        cp \
          "${CONFIG_FILE}" \
          /tmp/database-config.json

        echo "Approved database configuration:"

        cat /tmp/database-config.json


      - |
        set -euo pipefail

        echo "========================================"
        echo "DOWNLOAD APPROVED DATABASE ARTIFACTS"
        echo "========================================"

        rm -rf /tmp/db-release

        mkdir -p /tmp/db-release

        SCHEMA_COUNT=0

        while IFS= read -r DATABASE
        do
          if [ -z "${DATABASE}" ]; then
            continue
          fi

          while IFS= read -r SCHEMA
          do
            if [ -z "${SCHEMA}" ]; then
              echo "ERROR - Empty schema in database configuration"
              exit 1
            fi

            SCHEMA_COUNT=$((SCHEMA_COUNT + 1))

            LOCAL_DIR="/tmp/db-release/${DATABASE}/${SCHEMA}"

            mkdir -p "${LOCAL_DIR}"

           BASELINE_URI="s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/${PLAN_ENVIRONMENT}/baseline/${DATABASE}/${SCHEMA}"

          FORWARD_URI="s3://${RELEASE_BUCKET}/${RELEASE_PREFIX}/${PLAN_ENVIRONMENT}/forward/${DATABASE}/${SCHEMA}"

            aws s3 cp \
              "${BASELINE_URI}/schema.sql" \
              "${LOCAL_DIR}/baseline.sql"

            aws s3 cp \
              "${BASELINE_URI}/schema.sql.sha256" \
              "${LOCAL_DIR}/baseline.sql.sha256"

            aws s3 cp \
              "${FORWARD_URI}/migration.sql" \
              "${LOCAL_DIR}/migration.sql"

            aws s3 cp \
              "${FORWARD_URI}/migration.sql.sha256" \
              "${LOCAL_DIR}/migration.sql.sha256"

            BASELINE_EXPECTED_SHA="$(
              awk '{print $1}' \
                "${LOCAL_DIR}/baseline.sql.sha256"
            )"

            BASELINE_ACTUAL_SHA="$(
              sha256sum \
                "${LOCAL_DIR}/baseline.sql" |
              awk '{print $1}'
            )"

            if [ -z "${BASELINE_EXPECTED_SHA}" ] || \
               [ "${BASELINE_EXPECTED_SHA}" != "${BASELINE_ACTUAL_SHA}" ]
            then
              echo "ERROR - Baseline checksum mismatch"
              echo "Database=${DATABASE}"
              echo "Schema=${SCHEMA}"
              exit 1
            fi

            MIGRATION_EXPECTED_SHA="$(
              awk '{print $1}' \
                "${LOCAL_DIR}/migration.sql.sha256"
            )"

            MIGRATION_ACTUAL_SHA="$(
              sha256sum \
                "${LOCAL_DIR}/migration.sql" |
              awk '{print $1}'
            )"

            if [ -z "${MIGRATION_EXPECTED_SHA}" ] || \
               [ "${MIGRATION_EXPECTED_SHA}" != "${MIGRATION_ACTUAL_SHA}" ]
            then
              echo "ERROR - Migration checksum mismatch"
              echo "Database=${DATABASE}"
              echo "Schema=${SCHEMA}"
              exit 1
            fi

            echo "Approved artifacts verified for ${DATABASE}.${SCHEMA}"

          done < <(
            jq -r \
              --arg database "${DATABASE}" \
              '.[$database][]' \
              /tmp/database-config.json
          )

        done < <(
          jq -r \
            'keys[]' \
            /tmp/database-config.json
        )

        if [ "${SCHEMA_COUNT}" -eq 0 ]; then
          echo "ERROR - No database schemas were found"
          exit 1
        fi

        echo "Approved database artifacts downloaded and verified"


      - |
        set -euo pipefail

        echo "========================================"
        echo "ASSUME T1 TARGET ROLE"
        echo "========================================"

        ASSUME_RESULT="$(
          aws sts assume-role \
            --role-arn "${TARGET_ROLE_ARN}" \
            --role-session-name "bach-db-t1-deploy"
        )"

        AWS_ACCESS_KEY_ID_VALUE="$(
          jq -r \
            '.Credentials.AccessKeyId // empty' \
            <<< "${ASSUME_RESULT}"
        )"

        AWS_SECRET_ACCESS_KEY_VALUE="$(
          jq -r \
            '.Credentials.SecretAccessKey // empty' \
            <<< "${ASSUME_RESULT}"
        )"

        AWS_SESSION_TOKEN_VALUE="$(
          jq -r \
            '.Credentials.SessionToken // empty' \
            <<< "${ASSUME_RESULT}"
        )"

        if [ -z "${AWS_ACCESS_KEY_ID_VALUE}" ] || \
           [ -z "${AWS_SECRET_ACCESS_KEY_VALUE}" ] || \
           [ -z "${AWS_SESSION_TOKEN_VALUE}" ]
        then
          echo "ERROR - AssumeRole did not return valid credentials"
          exit 1
        fi

        export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID_VALUE}"
        export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY_VALUE}"
        export AWS_SESSION_TOKEN="${AWS_SESSION_TOKEN_VALUE}"

        echo "Assumed T1 target role successfully"

        aws sts get-caller-identity


      - |
        set -euo pipefail

        echo "========================================"
        echo "LOAD T1 DEPLOY SECRET"
        echo "========================================"

        SECRET_JSON="$(
          aws secretsmanager get-secret-value \
            --secret-id "${DEPLOY_SECRET_ID}" \
            --query SecretString \
            --output text
        )"

        export PGHOST="$(
          jq -r \
            '.host // empty' \
            <<< "${SECRET_JSON}"
        )"

        export PGPORT="$(
          jq -r \
            '.port // empty' \
            <<< "${SECRET_JSON}"
        )"

        export PGUSER="$(
          jq -r \
            '.username // empty' \
            <<< "${SECRET_JSON}"
        )"

        export PGPASSWORD="$(
          jq -r \
            '.password // empty' \
            <<< "${SECRET_JSON}"
        )"

        if [ -z "${PGHOST}" ]; then
          echo "ERROR - host is missing from deploy secret"
          exit 1
        fi

        if [ -z "${PGPORT}" ]; then
          echo "ERROR - port is missing from deploy secret"
          exit 1
        fi

        if [ -z "${PGUSER}" ]; then
          echo "ERROR - username is missing from deploy secret"
          exit 1
        fi

        if [ -z "${PGPASSWORD}" ]; then
          echo "ERROR - password is missing from deploy secret"
          exit 1
        fi

        echo "T1 deploy secret loaded successfully"
        echo "Database host=${PGHOST}"
        echo "Database port=${PGPORT}"
        echo "Database user=${PGUSER}"


  build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "VERIFY ALL T1 DATABASE BASELINES"
        echo "========================================"

        rm -rf /tmp/current-schema

        mkdir -p /tmp/current-schema

        while IFS= read -r DATABASE
        do
          if [ -z "${DATABASE}" ]; then
            continue
          fi

          echo "Testing database connection to ${DATABASE}"

          psql \
            --host="${PGHOST}" \
            --port="${PGPORT}" \
            --username="${PGUSER}" \
            --dbname="${DATABASE}" \
            --set ON_ERROR_STOP=1 \
            --command="SELECT current_database(), current_user;"

          while IFS= read -r SCHEMA
          do
            if [ -z "${SCHEMA}" ]; then
              echo "ERROR - Empty schema in database configuration"
              exit 1
            fi

            echo "Checking approved baseline for ${DATABASE}.${SCHEMA}"

            LOCAL_DIR="/tmp/db-release/${DATABASE}/${SCHEMA}"

            CURRENT_DIR="/tmp/current-schema/${DATABASE}/${SCHEMA}"

            mkdir -p "${CURRENT_DIR}"

            SCHEMA_PATTERN="\"${SCHEMA}\""

            pg_dump \
              --host="${PGHOST}" \
              --port="${PGPORT}" \
              --username="${PGUSER}" \
              --dbname="${DATABASE}" \
              --schema="${SCHEMA_PATTERN}" \
              --schema-only \
              --no-owner \
              --no-privileges \
              --file="${CURRENT_DIR}/current.sql"

            if [ ! -s "${CURRENT_DIR}/current.sql" ]; then
              echo "ERROR - Current schema dump is empty"
              echo "Database=${DATABASE}"
              echo "Schema=${SCHEMA}"
              exit 1
            fi

            sed \
              -e '/^[[:space:]]*\\restrict\([[:space:]].*\)\{0,1\}[[:space:]]*$/d' \
              -e '/^[[:space:]]*\\unrestrict\([[:space:]].*\)\{0,1\}[[:space:]]*$/d' \
              "${LOCAL_DIR}/baseline.sql" \
              > "${CURRENT_DIR}/baseline-normalized.sql"

            sed \
              -e '/^[[:space:]]*\\restrict\([[:space:]].*\)\{0,1\}[[:space:]]*$/d' \
              -e '/^[[:space:]]*\\unrestrict\([[:space:]].*\)\{0,1\}[[:space:]]*$/d' \
              "${CURRENT_DIR}/current.sql" \
              > "${CURRENT_DIR}/current-normalized.sql"

            if ! cmp -s \
              "${CURRENT_DIR}/baseline-normalized.sql" \
              "${CURRENT_DIR}/current-normalized.sql"
            then
              echo "ERROR - Schema drift detected"
              echo "Database=${DATABASE}"
              echo "Schema=${SCHEMA}"

              diff \
                -u \
                "${CURRENT_DIR}/baseline-normalized.sql" \
                "${CURRENT_DIR}/current-normalized.sql" \
                || true

              exit 1
            fi

            echo "Approved baseline matched for ${DATABASE}.${SCHEMA}"

          done < <(
            jq -r \
              --arg database "${DATABASE}" \
              '.[$database][]' \
              /tmp/database-config.json
          )

        done < <(
          jq -r \
            'keys[]' \
            /tmp/database-config.json
        )

        echo "All T1 schemas match the approved baseline"


      - |
        set -euo pipefail

        echo "========================================"
        echo "DEPLOY APPROVED MIGRATIONS TO T1"
        echo "========================================"

        while IFS= read -r DATABASE
        do
          if [ -z "${DATABASE}" ]; then
            continue
          fi

          while IFS= read -r SCHEMA
          do
            if [ -z "${SCHEMA}" ]; then
              echo "ERROR - Empty schema in database configuration"
              exit 1
            fi

            MIGRATION_FILE="/tmp/db-release/${DATABASE}/${SCHEMA}/migration.sql"

            if [ ! -f "${MIGRATION_FILE}" ]; then
              echo "ERROR - Approved migration file is missing"
              echo "${MIGRATION_FILE}"
              exit 1
            fi

            echo "Deploying ${DATABASE}.${SCHEMA}"

            if [ -s "${MIGRATION_FILE}" ]; then
              psql \
                --host="${PGHOST}" \
                --port="${PGPORT}" \
                --username="${PGUSER}" \
                --dbname="${DATABASE}" \
                --set ON_ERROR_STOP=1 \
                --file="${MIGRATION_FILE}"

              echo "Migration completed for ${DATABASE}.${SCHEMA}"
            else
              echo "No migration required for ${DATABASE}.${SCHEMA}"
            fi

          done < <(
            jq -r \
              --arg database "${DATABASE}" \
              '.[$database][]' \
              /tmp/database-config.json
          )

        done < <(
          jq -r \
            'keys[]' \
            /tmp/database-config.json
        )

        echo "All approved T1 migrations completed"


  post_build:

    commands:

      - |
        set -euo pipefail

        echo "========================================"
        echo "T1 DATABASE DEPLOYMENT COMPLETE"
        echo "========================================"

        echo "Release branch=${RELEASE_BRANCH}"
        echo "Release commit=${RELEASE_COMMIT}"
        echo "Release prefix=${RELEASE_PREFIX}"
        echo "Plan environment=${PLAN_ENVIRONMENT}"
        echo "Target environment=${TARGET_ENVIRONMENT}"
